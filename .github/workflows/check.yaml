name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install recovery fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils gnupg
      - name: Validate public inputs, regression tests and playbooks
        run: python3 tools/check.py
      - name: Audit the production npm lock
        working-directory: deploy/roles/paperclip/files
        run: npm audit --omit=dev --package-lock-only --audit-level=moderate
      - name: Audit the Paperclip MCP server lock
        working-directory: deploy/roles/paperclip_mcp/files
        run: npm audit --omit=dev --package-lock-only --audit-level=moderate
      - name: Audit the qualified Hermes Python inventory
        run: |
          python3 -m venv /tmp/zelab-audit-tools
          /tmp/zelab-audit-tools/bin/pip install pip-audit==2.10.1
          /tmp/zelab-audit-tools/bin/pip-audit --no-deps --disable-pip -r deploy/roles/hermes/files/dependencies/runtime-requirements.txt
