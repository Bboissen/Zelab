[defaults]
inventory = inventory.yaml
retry_files_enabled = False
interpreter_python = auto_silent
host_key_checking = True

[privilege_escalation]
become = True
become_method = sudo
become_flags = -n

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=2
use_tty = False
