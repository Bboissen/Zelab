- name: Prepare parked native bot reserves with independent restricted tools
  hosts: guest
  gather_facts: false
  become: true
  vars_files:
    - ../versions.yaml
  vars:
    reserve_indexes: "{{ range(1, (hermes_reserve_count | default(5) | int) + 1) | list }}"
    reserve_description: Unallocated bot identity; remains parked until deliberately assigned
  roles:
    - guest_network
  tasks:
    - name: Validate the declared initial pool size
      ansible.builtin.assert:
        that:
          - hermes_reserve_count | default(5) | int >= 0
          - hermes_reserve_count | default(5) | int <= 10

    - name: Inspect each reserve profile slot
      ansible.builtin.stat:
        path: "/var/lib/zelab/hermes/home/profiles/reserve-{{ '%02d' | format(item) }}"
        get_checksum: false
      loop: "{{ reserve_indexes }}"
      register: reserve_slots

    - name: Inspect each reserve seed marker
      ansible.builtin.stat:
        path: "/var/lib/zelab/hermes/reserve-{{ '%02d' | format(item) }}-config-seeded"
        get_checksum: false
      loop: "{{ reserve_indexes }}"
      register: reserve_seeds

    # Only wholly unused slots are created here; a partial slot still fails in
    # the role's integrity check below.
    - name: Select the reserve slots that are still unused
      ansible.builtin.set_fact:
        reserve_new_indexes: >-
          {{ reserve_slots.results | rejectattr('stat.exists') | map(attribute='item') | list
             | intersect(reserve_seeds.results | rejectattr('stat.exists') | map(attribute='item') | list) }}

    # Native profile creation builds in a private staging directory and
    # publishes with one rename, so independent profiles can be created together.
    - name: Create the unused blank native reserve profiles in parallel
      ansible.builtin.command:
        argv:
          - "{{ hermes_install_dir }}/.hermes/bin/hermes"
          - profile
          - create
          - "reserve-{{ '%02d' | format(item) }}"
          - --no-alias
          - --no-skills
          - --description
          - "{{ reserve_description }}"
        creates: "/var/lib/zelab/hermes/home/profiles/reserve-{{ '%02d' | format(item) }}"
      become_user: zelab-hermes
      environment: "{{ hermes_cli_environment }}"
      async: 600
      poll: 0
      loop: "{{ reserve_new_indexes }}"
      register: reserve_create_jobs

    - name: Wait for the parallel reserve profile creation
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      become_user: zelab-hermes
      loop: "{{ reserve_create_jobs.results }}"
      loop_control:
        label: "reserve-{{ '%02d' | format(item.item) }}"
      register: reserve_created
      until: reserve_created.finished
      retries: 200
      delay: 2

    - name: Remove the finished reserve creation job records
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
        mode: cleanup
      become_user: zelab-hermes
      loop: "{{ reserve_create_jobs.results }}"
      loop_control:
        label: "reserve-{{ '%02d' | format(item.item) }}"

    # Park immediately, as the role would, before the per-slot setup below.
    - name: Park the new reserve profiles
      ansible.builtin.copy:
        dest: "/var/lib/zelab/hermes/home/profiles/reserve-{{ '%02d' | format(item) }}/gateway.parked"
        content: ""
        owner: zelab-hermes
        group: zelab-hermes
        mode: '0600'
        force: false
      loop: "{{ reserve_new_indexes }}"

    - name: Prepare each blank native reserve without cloning owner state
      ansible.builtin.include_role:
        name: research_profile
      vars:
        hermes_profile_name: "reserve-{{ '%02d' | format(reserve_index) }}"
        research_tool_user: "zelab-reserve-{{ '%02d' | format(reserve_index) }}"
        research_tool_uid: "{{ 61110 + reserve_index }}"
        research_tool_home: "/var/lib/zelab-reserve-{{ '%02d' | format(reserve_index) }}"
        research_profile_description: "{{ reserve_description }}"
        research_profile_parked: true
        research_profile_precreated: "{{ reserve_index in reserve_new_indexes }}"
        research_install_shared: false
        research_defer_admission_check: true
      loop: "{{ reserve_indexes }}"
      loop_control:
        loop_var: reserve_index

    - name: Start an empty profile list
      ansible.builtin.set_fact:
        reserve_check_profiles: []

    - name: List every reserve for the admission check
      ansible.builtin.set_fact:
        reserve_check_profiles: >-
          {{ reserve_check_profiles + [{
             'home': '/var/lib/zelab/hermes/home/profiles/reserve-%02d' | format(item),
             'tool_user': 'zelab-reserve-%02d' | format(item)}] }}
      loop: "{{ reserve_indexes }}"

    - name: Check retained owner admission and native SSH environment of every reserve
      ansible.builtin.include_role:
        name: hermes_config_check
        tasks_from: batch.yaml
      vars:
        checked_profiles: "{{ reserve_check_profiles | default([]) }}"
