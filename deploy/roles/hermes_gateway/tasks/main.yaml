- name: Recheck default owner admission before starting the native gateway
  ansible.builtin.include_role:
    name: hermes_config_check

- name: Find named native profiles before gateway activation
  ansible.builtin.find:
    paths: /var/lib/zelab/hermes/home/profiles
    file_type: directory
    recurse: false
  register: gateway_profiles

- name: Find parked named profiles, which the gateway does not serve
  ansible.builtin.stat:
    path: "{{ item.path }}/gateway.parked"
    get_checksum: false
  loop: "{{ gateway_profiles.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: gateway_parked

- name: Start an empty profile list
  ansible.builtin.set_fact:
    gateway_active_profiles: []

- name: List the active named profiles
  ansible.builtin.set_fact:
    gateway_active_profiles: "{{ gateway_active_profiles + [{'home': item.item.path}] }}"
  loop: "{{ gateway_parked.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  when: not (item.stat.exists and item.stat.isreg)

# Parked profiles were checked with their restricted tools when prepared; the
# check would only start the runtime to skip them.
- name: Require owner-only admission in every active named profile
  ansible.builtin.include_role:
    name: hermes_config_check
    tasks_from: batch.yaml
  vars:
    checked_skip_parked: true
    checked_profiles: "{{ gateway_active_profiles | default([]) }}"

- name: Enable native user services without a login session
  ansible.builtin.command:
    argv: [loginctl, enable-linger, zelab-hermes]
    creates: /var/lib/systemd/linger/zelab-hermes

- name: Start the native Hermes user service manager
  ansible.builtin.systemd_service:
    name: user@61102.service
    state: started

- name: Install the unmodified native shared gateway user unit
  ansible.builtin.command:
    argv:
      - "{{ hermes_install_dir }}/.hermes/bin/hermes"
      - gateway
      - install
      - --if-missing
      - --no-start-now
      - --start-on-login
    creates: "/home/zelab-hermes/.config/systemd/user/{{ hermes_gateway_unit }}"
  become_user: zelab-hermes
  environment: "{{ hermes_cli_environment | combine(hermes_session_environment) }}"

- name: Prepare conventional native gateway environment drop-in
  ansible.builtin.file:
    path: "/home/zelab-hermes/.config/systemd/user/{{ hermes_gateway_unit }}.d"
    state: directory
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0700'

- name: Keep native SSH socket paths short in the shared gateway
  ansible.builtin.copy:
    dest: "/home/zelab-hermes/.config/systemd/user/{{ hermes_gateway_unit }}.d/zelab.conf"
    content: "[Service]\nEnvironment=TMPDIR=/var/lib/zelab/hermes/tmp\nUMask=0077\n"
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0600'
  register: native_gateway_environment

- name: Enable and start the native shared gateway
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ hermes_gateway_unit }}"
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if native_gateway_environment.changed or (hermes_dependencies is defined and hermes_dependencies.changed) else 'started' }}"
  become_user: zelab-hermes
  environment: "{{ hermes_cli_environment | combine(hermes_session_environment) }}"
