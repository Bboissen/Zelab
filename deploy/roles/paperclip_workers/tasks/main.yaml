- name: Seed native company and workers without exposing credentials
  no_log: true
  block:
    - name: Sign in as the configured local owner
      ansible.builtin.include_role:
        name: paperclip_owner_session

    - name: Reuse an existing native company
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ paperclip_port }}/api/companies"
        headers: {Cookie: "{{ paperclip_owner_session.cookies_string }}"}
      register: worker_companies

    - name: Reject ambiguous company names
      ansible.builtin.assert:
        that: worker_companies.json | selectattr('name', 'equalto', paperclip_company_name) | list | length <= 1

    - name: Create the declared native company once
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ paperclip_port }}/api/companies"
        method: POST
        body_format: json
        body: {name: "{{ paperclip_company_name }}", description: Private server Operations}
        headers: {Cookie: "{{ paperclip_owner_session.cookies_string }}", Origin: "http://127.0.0.1:{{ paperclip_port }}"}
        status_code: 201
      when: worker_companies.json | selectattr('name', 'equalto', paperclip_company_name) | list | length == 0
      register: worker_company_created
      changed_when: true

    - name: Resolve native company identity
      ansible.builtin.set_fact:
        worker_company: "{{ worker_company_created.json if worker_company_created is not skipped else (worker_companies.json | selectattr('name', 'equalto', paperclip_company_name) | first) }}"

    - name: Set initial native owner provisioning policy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ paperclip_port }}/api/companies/{{ worker_company.id }}"
        method: PATCH
        body_format: json
        body: {requireBoardApprovalForNewAgents: false}
        headers: {Cookie: "{{ paperclip_owner_session.cookies_string }}", Origin: "http://127.0.0.1:{{ paperclip_port }}"}
      when: worker_company_created is not skipped
      changed_when: true

    # SSH environments copy this coordinator-side folder to the worker and back on every run.
    - name: Prepare the coordinator-side Operations workspace
      ansible.builtin.file:
        path: "{{ paperclip_home }}/worker-workspaces/ops"
        state: directory
        owner: "{{ paperclip_user }}"
        group: "{{ paperclip_user }}"
        mode: '0700'

    - name: Seed the Operations project and its single worker without rewriting later UI edits
      ansible.builtin.include_tasks: worker.yaml
      vars:
        worker:
          role: ops
          name: Operations
          agent_role: devops
          user: "{{ worker_ops_user }}"
          home: "{{ worker_ops_home }}"
          paperclip_workspace: "{{ paperclip_home }}/worker-workspaces/ops"

    - name: Save native resource IDs privately for operational checks
      ansible.builtin.copy:
        dest: "{{ private_dir }}/paperclip-worker-ids.json"
        content: "{{ {'company_id': worker_company.id, 'workers': worker_ids} | to_nice_json }}\n"
        owner: "{{ operator_user }}"
        mode: '0600'
