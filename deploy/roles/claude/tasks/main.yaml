- name: Inspect the installed native Claude Code
  ansible.builtin.stat:
    path: "/opt/zelab-tools/claude-{{ claude_version }}/claude"
    get_checksum: false
  register: claude_installed_binary

- name: Download checksum-verified upstream native Claude Code
  ansible.builtin.include_role:
    name: pinned_download
  vars:
    download_url: "{{ claude_binary_url }}"
    download_dest: "/var/cache/zelab/claude-{{ claude_version }}"
    download_checksum: "sha256:{{ claude_binary_sha256 }}"
    download_mode: '0755'
  when: not claude_installed_binary.stat.exists

- name: Create independent native CLI location
  ansible.builtin.file:
    path: "/opt/zelab-tools/claude-{{ claude_version }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the unmodified pinned Claude Code binary
  ansible.builtin.copy:
    src: "/var/cache/zelab/claude-{{ claude_version }}"
    dest: "/opt/zelab-tools/claude-{{ claude_version }}/claude"
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  when: not claude_installed_binary.stat.exists

- name: Keep the installed binary root-owned
  ansible.builtin.file:
    path: "/opt/zelab-tools/claude-{{ claude_version }}/claude"
    owner: root
    group: root
    mode: '0755'

- name: Remove the consumed Claude Code download
  ansible.builtin.file:
    path: "/var/cache/zelab/claude-{{ claude_version }}"
    state: absent

- name: Inspect the optional worker command before publishing it
  ansible.builtin.stat:
    path: /usr/local/bin/zelab-claude
    follow: false
  register: claude_command

- name: Preserve an independently managed worker command
  ansible.builtin.assert:
    that: not claude_command.stat.exists or (claude_command.stat.islnk and claude_command.stat.lnk_source.startswith('/opt/zelab-tools/claude-'))

- name: Publish the explicitly selected worker command
  ansible.builtin.file:
    src: "/opt/zelab-tools/claude-{{ claude_version }}/claude"
    dest: /usr/local/bin/zelab-claude
    state: link
    owner: root
    group: root

- name: Verify actual native CLI version
  ansible.builtin.command:
    argv: [/usr/local/bin/zelab-claude, --version]
  register: claude_installed
  changed_when: false
  failed_when: claude_version not in claude_installed.stdout
