- name: Install declared guest source prerequisites
  ansible.builtin.apt:
    name:
      - git
      - curl
      - tar
      - ca-certificates
      - libatomic1
      - acl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Keep the existing Hermes state identity
  ansible.builtin.user:
    name: zelab-hermes
    uid: 61102
    home: /home/zelab-hermes
    shell: /usr/sbin/nologin
    create_home: true

- name: Keep native socket temporary paths short and private
  ansible.builtin.file:
    path: /var/lib/zelab/hermes/tmp
    state: directory
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0700'

- name: Prepare the persistent native Hermes home
  ansible.builtin.file:
    path: /var/lib/zelab/hermes/home
    state: directory
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0700'

- name: Prepare the native dashboard working directory
  ansible.builtin.file:
    path: /var/lib/zelab/hermes/scratch
    state: directory
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0700'

- name: Import explicitly supplied native subscription auth once on a fresh site
  ansible.builtin.copy:
    src: "{{ hermes_auth_import }}"
    dest: /var/lib/zelab/hermes/home/auth.json
    force: false
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0600'
  when: hermes_auth_import is defined
  no_log: true
  diff: false

- name: Create independent upstream release location
  ansible.builtin.file:
    path: /opt/hermes/releases
    state: directory
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0755'

- name: Acquire verified upstream installer
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/NousResearch/hermes-agent/{{ hermes_commit }}/scripts/install.sh"
    dest: "/opt/hermes/releases/install-{{ hermes_commit }}.sh"
    checksum: "sha256:{{ hermes_installer_sha256 }}"
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0755'
  # Mirrors rate-limit or drop connections now and then (HTTP 429/5xx); retry before failing.
  register: download
  until: download is succeeded
  retries: 5
  delay: 30

- name: Prepare the parent of the selected stable native checkout
  ansible.builtin.file:
    path: "{{ hermes_install_dir | dirname }}"
    state: directory
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0755'

- name: Inspect a checkout left by an interrupted install
  ansible.builtin.stat:
    path: "{{ hermes_install_dir }}/.git"
  register: hermes_checkout

- name: Read the checkout revision without changing it
  ansible.builtin.command:
    argv: [git, -C, "{{ hermes_install_dir }}", rev-parse, --verify, HEAD]
  become_user: zelab-hermes
  register: hermes_partial_checkout
  changed_when: false
  failed_when: false
  when: hermes_checkout.stat.exists

# Only an installer-created clone without a readable revision is removed; it is
# software, not Hermes state (which lives in /var/lib/zelab/hermes/home).
- name: Remove an unreadable partial clone so the installer can retry
  ansible.builtin.file:
    path: "{{ hermes_install_dir }}"
    state: absent
  when: hermes_checkout.stat.exists and hermes_partial_checkout.rc != 0

- name: Fetch selected upstream commit through native installer
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "/opt/hermes/releases/install-{{ hermes_commit }}.sh"
      - --commit
      - "{{ hermes_commit }}"
      - --dir
      - "{{ hermes_install_dir }}"
      - --hermes-home
      - /var/lib/zelab/hermes/home
      - --non-interactive
      - --skip-browser
      - --skip-computer-use
      - --stage
      - repository
    creates: "{{ hermes_install_dir }}/.git"
  become_user: zelab-hermes
  environment:
    HOME: /home/zelab-hermes

- name: Read the actual native source revision before reapplying
  ansible.builtin.command:
    argv: [git, -C, "{{ hermes_install_dir }}", rev-parse, HEAD]
  become_user: zelab-hermes
  register: hermes_native_revision
  changed_when: false

- name: Require explicit adoption of future native UI source updates
  ansible.builtin.assert:
    that: hermes_native_revision.stdout | trim == hermes_commit
    fail_msg: Native Hermes source changed; qualify and adopt its pin before reapplying. Runtime state will not be reset.

- name: Select the audited Python dependency manifests
  ansible.builtin.include_tasks: dependencies.yaml

- name: Prepare native pinned Python and dependency generations
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "/opt/hermes/releases/install-{{ hermes_commit }}.sh"
      - --commit
      - "{{ hermes_commit }}"
      - --dir
      - "{{ hermes_install_dir }}"
      - --hermes-home
      - /var/lib/zelab/hermes/home
      - --non-interactive
      - --skip-browser
      - --skip-computer-use
      - --stage
      - python-deps
    creates: "{{ hermes_install_dir }}/.hermes/zelab-dependencies-ready-{{ hermes_dependency_revision }}"
  register: hermes_dependencies
  become_user: zelab-hermes
  environment:
    HOME: /home/zelab-hermes
    HERMES_WEB_BUILD_LIGHT: '1'
    NODE_OPTIONS: --max-old-space-size=768

- name: Record completed native dependency preparation
  ansible.builtin.copy:
    dest: "{{ hermes_install_dir }}/.hermes/zelab-dependencies-ready-{{ hermes_dependency_revision }}"
    content: "{{ hermes_commit }} {{ hermes_dependency_revision }}\n"
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0600'

- name: Transfer host-built native dashboard assets
  ansible.builtin.copy:
    src: "/var/cache/zelab/hermes-web-{{ hermes_commit }}.tar"
    dest: "/opt/hermes/releases/hermes-web-{{ hermes_commit }}.tar"
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0644'

- name: Install prebuilt dashboard output
  ansible.builtin.unarchive:
    src: "/opt/hermes/releases/hermes-web-{{ hermes_commit }}.tar"
    remote_src: true
    dest: "{{ hermes_install_dir }}"
    owner: zelab-hermes
    group: zelab-hermes
    creates: "{{ hermes_install_dir }}/.hermes/zelab-web-assets-{{ hermes_commit }}"
  register: hermes_web_assets

- name: Record the source revision of the installed native dashboard assets
  ansible.builtin.copy:
    dest: "{{ hermes_install_dir }}/.hermes/zelab-web-assets-{{ hermes_commit }}"
    content: "{{ hermes_commit }}\n"
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0600'

- name: Check the one-time initial configuration marker
  ansible.builtin.stat:
    path: /var/lib/zelab/hermes/native-config-migrated
  register: native_config

- name: Seed the initial native configuration once
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /var/lib/zelab/hermes/home/config.yaml
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0600'
  when: not native_config.stat.exists

- name: Initialize fresh messaging with owner-only admission before token entry
  ansible.builtin.copy:
    dest: /var/lib/zelab/hermes/home/.env
    content: |
      # Enter a bot token in the native Hermes Channels UI.
      DISCORD_ALLOWED_USERS={{ research_initial_allowed_user }}
      DISCORD_ALLOW_ALL_USERS=false
      GATEWAY_ALLOW_ALL_USERS=false
      DISCORD_ALLOW_BOTS=false
    force: false
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0600'

- name: Admit the declared owner once discord_owner_id is configured
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        from pathlib import Path
        import os, sys
        path, owner = Path(sys.argv[1]), sys.argv[2]
        lines = path.read_text().splitlines()
        values = {l.partition('=')[0].strip(): l.partition('=')[2].strip() for l in lines if '=' in l and not l.lstrip().startswith('#')}
        if values.get('DISCORD_ALLOWED_USERS'):
            print('unchanged')
            raise SystemExit
        lines = [l for l in lines if l.partition('=')[0].strip() != 'DISCORD_ALLOWED_USERS']
        path.write_text('\n'.join(lines + ['DISCORD_ALLOWED_USERS=' + owner]) + '\n')
        path.chmod(0o600)
        os.chown(path, 61102, 61102)
        print('admitted')
      - /var/lib/zelab/hermes/home/.env
      - "{{ research_initial_allowed_user }}"
  register: hermes_owner_admission
  changed_when: hermes_owner_admission.stdout == 'admitted'
  when: research_initial_allowed_user | length > 0
  no_log: true

- name: Check retained owner admission before exposing the native dashboard
  ansible.builtin.include_role:
    name: hermes_config_check

- name: Record the completed initial configuration seed
  ansible.builtin.copy:
    dest: /var/lib/zelab/hermes/native-config-migrated
    content: "Native initial config seeded; subsequent UI changes are retained.\n"
    owner: root
    group: root
    mode: '0600'

- name: Preserve retained native dashboard credentials
  ansible.builtin.include_role:
    name: retained_secrets
  vars:
    retained_secrets:
      - {installed: /etc/hermes-dashboard.env, source: "{{ private_dir }}/hermes-dashboard.password-hash"}
      - {installed: /etc/hermes-dashboard.env, source: "{{ private_dir }}/hermes-dashboard.session-secret"}

- name: Install persistent native dashboard authentication
  ansible.builtin.template:
    src: dashboard.env.j2
    dest: /etc/hermes-dashboard.env
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  register: dashboard_auth

- name: Install native dashboard service
  ansible.builtin.template:
    src: hermes-dashboard.service.j2
    dest: /etc/systemd/system/hermes-dashboard.service
    owner: root
    group: root
    mode: '0644'
  register: dashboard_unit

- name: Activate authenticated native dashboard behind host loopback forwarding
  ansible.builtin.systemd_service:
    name: hermes-dashboard.service
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if dashboard_unit.changed or dashboard_auth.changed or hermes_dependencies.changed or hermes_web_assets.changed else 'started' }}"

- name: Wait for the native dashboard listener instead of trusting a restarting unit
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8640
    timeout: 90

- name: Verify the running dashboard rejects anonymous profile access
  ansible.builtin.uri:
    url: http://127.0.0.1:8640/api/profiles
    status_code: 401

- name: Inspect the transient password for native hash migration verification
  ansible.builtin.stat:
    path: "{{ zelab_password_dir }}/hermes-dashboard.password"
    get_checksum: false
  delegate_to: zelab_host
  register: dashboard_password_input
  when: zelab_password_dir is defined
  no_log: true

- name: Verify native password login after migrating to a retained hash
  ansible.builtin.uri:
    url: http://127.0.0.1:8640/auth/password-login
    method: POST
    body_format: json
    body:
      provider: basic
      username: "{{ dashboard_username }}"
      password: "{{ lookup('ansible.builtin.file', zelab_password_dir + '/hermes-dashboard.password') }}"
    status_code: 200
    follow_redirects: none
  register: dashboard_password_login
  when: zelab_password_dir is defined and dashboard_password_input.stat.exists | default(false)
  no_log: true

- name: Verify the new native login session can access protected dashboard profiles
  ansible.builtin.uri:
    url: http://127.0.0.1:8640/api/profiles
    headers:
      Cookie: "{{ dashboard_password_login.cookies_string }}"
    status_code: 200
    follow_redirects: none
  when: zelab_password_dir is defined and dashboard_password_input.stat.exists | default(false)
  no_log: true
