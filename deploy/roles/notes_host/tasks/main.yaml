- name: Validate notes-only paths and listener
  ansible.builtin.assert:
    that:
      - notes_vault_dir is match('^/[A-Za-z0-9_./-]+$')
      - notes_sftp_root is match('^/var/lib/[A-Za-z0-9_/-]+$')
      - notes_config_dir is match('^/etc/[A-Za-z0-9_/-]+$')
      - notes_sftp_root != notes_vault_dir
      - notes_owner_user == notes_container_user
      - notes_sftp_port | int > 1024
      - notes_sftp_port | int not in [guest_ssh_port | int, worker_ssh_port | int, paperclip_port | int]

- name: Install SSH, ACL and history prerequisites
  ansible.builtin.apt:
    name: [openssh-server, acl, git]
    state: present

- name: Create the vault group
  ansible.builtin.group:
    name: "{{ notes_owner_group }}"
    system: true

- name: Create the vault's filesystem identity, shared by Obsidian and the notes share
  ansible.builtin.user:
    name: "{{ notes_container_user }}"
    home: /vault
    shell: /usr/sbin/nologin
    group: "{{ notes_owner_group }}"
    groups: ''
    system: true
    create_home: false

# The mode's group bits are the ACL mask: 2770 keeps the mask rwx set below.
- name: Prepare the vault root and its Projects folder without changing existing notes
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ notes_container_user }}"
    group: "{{ notes_owner_group }}"
    mode: '2770'
  loop: ["{{ notes_vault_dir }}", "{{ notes_vault_dir }}/Projects"]

- name: Read the local owner editor identity
  ansible.builtin.command:
    argv: [rtk, proxy, id, -u, "{{ operator_user }}"]
  register: notes_operator_uid
  changed_when: false

- name: Maintain inherited group access and local owner editor ACLs
  ansible.builtin.command:
    argv:
      - rtk
      - proxy
      - python3
      - -c
      - |
        import subprocess,sys,json
        uid, *paths = sys.argv[1:]
        wanted = {'user:'+uid+':rwx', 'mask::rwx', 'default:user::rwx',
                  'default:user:'+uid+':rwx', 'default:group::rwx',
                  'default:mask::rwx', 'default:other::---'}
        changed = False
        for path in paths:
            current = subprocess.check_output(['rtk','proxy','getfacl','-cpn',path],text=True)
            if not wanted.issubset(set(current.splitlines())):
                subprocess.run(['rtk','proxy','setfacl','-m',','.join(sorted(wanted)),path],check=True)
                changed = True
        print(json.dumps({'changed':changed}))
      - "{{ notes_operator_uid.stdout | trim }}"
      - "{{ notes_vault_dir }}"
      - "{{ notes_vault_dir }}/Projects"
  register: notes_acl
  changed_when: (notes_acl.stdout | from_json).changed

# Created after the ACLs so each folder inherits them; a removed project keeps its notes.
- name: Create a vault folder for each declared project
  ansible.builtin.file:
    path: "{{ notes_vault_dir }}/Projects/{{ item }}"
    state: directory
    owner: "{{ notes_container_user }}"
    group: "{{ notes_owner_group }}"
    mode: '2770'
  loop: "{{ zelab_projects | default({}) | list }}"

# The team works in the vault too. host-projects.yaml grants the same on later
# runs and revokes it when a tier goes; on a fresh site the vault exists only now.
- name: Let the team tier accounts read and write the whole vault
  ansible.builtin.command:
    argv: "{{ ['rtk', 'proxy', 'python3', '-c', notes_team_acl_script, notes_vault_dir]
              + (zelab_tiers | default({}) | dict2items | map(attribute='value.account') | list) }}"
  vars:
    notes_team_acl_script: |
      import json, pwd, subprocess, sys
      vault, *users = sys.argv[1:]
      changed = False
      for user in users:
          try:
              pwd.getpwnam(user)
          except KeyError:
              continue
          current = subprocess.check_output(['rtk', 'proxy', 'getfacl', '-cp', vault], text=True).splitlines()
          if not {f'user:{user}:rwx', f'default:user:{user}:rwx'} <= set(current):
              subprocess.run(['rtk', 'proxy', 'setfacl', '-R', '-m', f'u:{user}:rwx,d:u:{user}:rwx', vault], check=True)
              changed = True
      print(json.dumps({'changed': changed}))
  register: notes_team_acl
  changed_when: (notes_team_acl.stdout | from_json).changed


- name: Prepare root-owned chroot and authentication directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ notes_config_dir }}"
    - "{{ notes_config_dir }}/authorized_keys"
    - "{{ notes_sftp_root }}"
    - "{{ notes_sftp_root }}/{{ notes_owner_user }}"

- name: Create export mount destinations without changing a mounted vault
  ansible.builtin.command:
    argv: [rtk, proxy, install, -d, -m, '0755', "{{ notes_sftp_root }}/{{ item }}/vault"]
    creates: "{{ notes_sftp_root }}/{{ item }}/vault"
  loop: ["{{ notes_owner_user }}"]

- name: Preserve retained native notes keys
  ansible.builtin.include_role:
    name: retained_secrets
  vars:
    retained_secrets:
      - {installed: "{{ notes_config_dir }}/authorized_keys/{{ notes_owner_user }}", source: "{{ private_dir }}/notes-owner.key"}

- name: Generate the persistent native mount key outside Git
  ansible.builtin.command:
    argv: [rtk, proxy, ssh-keygen, -q, -t, ed25519, -N, '', -C, "zelab-notes-{{ item }}", -f, "{{ private_dir }}/notes-{{ item }}.key"]
    creates: "{{ private_dir }}/notes-{{ item }}.key"
  loop: [owner]
  become: false
  no_log: true

- name: Authorize the notes key only on this listener
  ansible.builtin.copy:
    dest: "{{ notes_config_dir }}/authorized_keys/{{ item.user }}"
    content: "from=\"127.0.0.1\",restrict {{ lookup('ansible.builtin.file', private_dir + '/notes-' + item.role + '.key.pub') }}\n"
    owner: root
    group: root
    mode: '0644'
  loop:
    - {user: "{{ notes_owner_user }}", role: owner}

- name: Declare the one export, the whole vault
  ansible.builtin.set_fact:
    notes_exports:
      - {role: owner, user: "{{ notes_owner_user }}", source: "{{ notes_vault_dir }}"}

- name: Derive canonical native bind mount unit names
  ansible.builtin.command:
    argv: [rtk, proxy, systemd-escape, --path, --suffix=mount, "{{ notes_sftp_root }}/{{ item.user }}/vault"]
  loop: "{{ notes_exports }}"
  register: notes_mount_names
  changed_when: false

- name: Install persistent notes-only bind exports
  ansible.builtin.template:
    src: bind.mount.j2
    dest: "/etc/systemd/system/{{ notes_mount_names.results[export_index].stdout | trim }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ notes_exports }}"
  loop_control:
    index_var: export_index
  register: notes_bind_units

- name: Start and enable the native bind exports
  ansible.builtin.systemd_service:
    name: "{{ item.stdout | trim }}"
    state: started
    enabled: true
    daemon_reload: "{{ notes_bind_units.changed }}"
  loop: "{{ notes_mount_names.results }}"
  loop_control:
    label: "{{ item.stdout | trim }}"

- name: Install the dedicated native SSH configuration
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: "{{ notes_config_dir }}/sshd.conf"
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/sshd -t -f %s
  register: notes_sshd_config

- name: Install the native notes listener service
  ansible.builtin.template:
    src: sshd.service.j2
    dest: /etc/systemd/system/zelab-notes-sshd.service
    owner: root
    group: root
    mode: '0644'
  register: notes_sshd_unit

- name: Start and enable only the new notes listener
  ansible.builtin.systemd_service:
    name: zelab-notes-sshd.service
    state: "{{ 'restarted' if notes_sshd_config.changed or notes_sshd_unit.changed else 'started' }}"
    enabled: true
    daemon_reload: "{{ notes_sshd_unit.changed }}"

# History: a root-only git directory outside the vault, which the guest cannot reach.
- name: Create the root-only vault history directory
  ansible.builtin.file:
    path: "{{ vault_history_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Initialize the vault history once
  ansible.builtin.command:
    argv: [rtk, proxy, git, init, --quiet, --bare, "{{ vault_history_dir }}"]
    creates: "{{ vault_history_dir }}/HEAD"

- name: Configure the history repository
  ansible.builtin.copy:
    dest: "{{ vault_history_dir }}/config"
    content: |
      [core]
        repositoryformatversion = 0
        filemode = true
        bare = false
        worktree = {{ notes_vault_dir }}
      [user]
        name = Zelab vault history
        email = vault-history@zelab.local
      [safe]
        directory = {{ notes_vault_dir }}
    owner: root
    group: root
    mode: '0600'

- name: Keep Obsidian's per-device state out of the history
  ansible.builtin.copy:
    dest: "{{ vault_history_dir }}/info/exclude"
    content: |
      .obsidian/workspace*.json
      .obsidian/cache
      .trash/
    owner: root
    group: root
    mode: '0644'

- name: Prepare the Zelab helper directory
  ansible.builtin.file:
    path: /usr/local/lib/zelab
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the snapshot script
  ansible.builtin.template:
    src: vault-history.sh.j2
    dest: /usr/local/lib/zelab/vault-history.sh
    owner: root
    group: root
    mode: '0755'

- name: Install the snapshot service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/zelab-{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [vault-history.service, vault-history.timer]
  register: notes_history_units

- name: Run vault history snapshots every few minutes
  ansible.builtin.systemd_service:
    name: zelab-vault-history.timer
    state: started
    enabled: true
    daemon_reload: "{{ notes_history_units.changed }}"
