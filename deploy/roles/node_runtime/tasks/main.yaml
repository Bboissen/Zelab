- name: Prepare the shared runtime directory
  ansible.builtin.file:
    path: /opt/zelab-tools
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Inspect the installed native Node runtime
  ansible.builtin.stat:
    path: "/opt/zelab-tools/node-v{{ node_version }}-linux-x64/bin/node"
    get_checksum: false
  register: node_installed

- name: Download the checksum-pinned upstream Node runtime
  ansible.builtin.include_role:
    name: pinned_download
  vars:
    download_url: "{{ node_archive_url }}"
    download_dest: "/var/cache/zelab/node-{{ node_version }}.tar.xz"
    download_checksum: "sha256:{{ node_archive_sha256 }}"
  when: not node_installed.stat.exists

- name: Extract the independent native Node runtime
  ansible.builtin.unarchive:
    src: "/var/cache/zelab/node-{{ node_version }}.tar.xz"
    remote_src: true
    dest: /opt/zelab-tools
    owner: root
    group: root
    creates: "/opt/zelab-tools/node-v{{ node_version }}-linux-x64/bin/node"
  when: not node_installed.stat.exists

- name: Remove the consumed Node archive
  ansible.builtin.file:
    path: "/var/cache/zelab/node-{{ node_version }}.tar.xz"
    state: absent
