- name: Start the build unless an earlier play already did
  ansible.builtin.include_tasks: start.yaml
  when: hermes_web_build_job is not defined

- name: Wait for the native dashboard asset build
  ansible.builtin.async_status:
    jid: "{{ hermes_web_build_job.ansible_job_id }}"
  become_user: "{{ operator_user }}"
  register: hermes_web_build
  until: hermes_web_build.finished
  retries: 600
  delay: 3
  when: hermes_web_build_job is not skipped

- name: Remove the finished build job record
  ansible.builtin.async_status:
    jid: "{{ hermes_web_build_job.ansible_job_id }}"
    mode: cleanup
  become_user: "{{ operator_user }}"
  when: hermes_web_build_job is not skipped

- name: Package only native web build output for transfer
  ansible.builtin.command:
    argv:
      - tar
      - -C
      - "/var/cache/zelab/hermes-agent-{{ hermes_commit }}"
      - -cf
      - "/var/cache/zelab/hermes-web-{{ hermes_commit }}.tar"
      - hermes_cli/web_dist
    creates: "/var/cache/zelab/hermes-web-{{ hermes_commit }}.tar"

# The guest copy action reads its source as the unprivileged controller, even
# when the remote task uses become. Do not inherit root's packaging umask.
- name: Make the public dashboard archive readable by the controller
  ansible.builtin.file:
    path: "/var/cache/zelab/hermes-web-{{ hermes_commit }}.tar"
    owner: root
    group: root
    mode: '0644'

# Only the small packaged output is needed again; a new pin rebuilds from source.
- name: Remove the consumed source archive and build tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/var/cache/zelab/hermes-agent-{{ hermes_commit }}"
    - "/var/cache/zelab/hermes-{{ hermes_commit }}.tar.gz"
