# Started early by prefetch.yaml so the build overlaps guest creation; main.yaml
# waits for it. A packaged archive from an earlier run skips the whole build.
- name: Inspect the packaged native dashboard assets
  ansible.builtin.stat:
    path: "/var/cache/zelab/hermes-web-{{ hermes_commit }}.tar"
    get_checksum: false
  register: hermes_web_archive

- name: Prepare the pinned native build runtime
  ansible.builtin.import_role:
    name: node_runtime

- name: Download verified Hermes source archive
  ansible.builtin.include_role:
    name: pinned_download
  vars:
    download_url: "{{ hermes_archive_url }}"
    download_dest: "/var/cache/zelab/hermes-{{ hermes_commit }}.tar.gz"
    download_checksum: "sha256:{{ hermes_archive_sha256 }}"
  when: not hermes_web_archive.stat.exists

- name: Extract upstream source for the host build
  ansible.builtin.unarchive:
    src: "/var/cache/zelab/hermes-{{ hermes_commit }}.tar.gz"
    remote_src: true
    dest: /var/cache/zelab
    creates: "/var/cache/zelab/hermes-agent-{{ hermes_commit }}/package.json"
    owner: "{{ operator_user }}"
  when: not hermes_web_archive.stat.exists

# npm's cache lives in the build tree, so removing the tree leaves nothing behind.
- name: Install only locked web build dependencies
  ansible.builtin.command:
    argv:
      - rtk
      - proxy
      - "/opt/zelab-tools/node-v{{ node_version }}-linux-x64/bin/npm"
      - ci
      - --workspace
      - web
      - --include-workspace-root
      - --no-audit
      - --no-fund
    chdir: "/var/cache/zelab/hermes-agent-{{ hermes_commit }}"
    creates: "/var/cache/zelab/hermes-agent-{{ hermes_commit }}/node_modules/.package-lock.json"
  become_user: "{{ operator_user }}"
  environment:
    PATH: "/opt/zelab-tools/node-v{{ node_version }}-linux-x64/bin:/usr/local/bin:/usr/bin:/bin"
    npm_config_cache: "/var/cache/zelab/hermes-agent-{{ hermes_commit }}/.npm-cache"
  when: not hermes_web_archive.stat.exists

- name: Start the native dashboard asset build in the background
  ansible.builtin.command:
    argv:
      - rtk
      - proxy
      - "/opt/zelab-tools/node-v{{ node_version }}-linux-x64/bin/npm"
      - run
      - build
      - --workspace
      - web
    chdir: "/var/cache/zelab/hermes-agent-{{ hermes_commit }}"
    creates: "/var/cache/zelab/hermes-agent-{{ hermes_commit }}/hermes_cli/web_dist/index.html"
  become_user: "{{ operator_user }}"
  environment:
    PATH: "/opt/zelab-tools/node-v{{ node_version }}-linux-x64/bin:/usr/local/bin:/usr/bin:/bin"
    NODE_OPTIONS: --max-old-space-size=2048
    RAYON_NUM_THREADS: '2'
    npm_config_cache: "/var/cache/zelab/hermes-agent-{{ hermes_commit }}/.npm-cache"
  async: 1800
  poll: 0
  register: hermes_web_build_job
  when: not hermes_web_archive.stat.exists
