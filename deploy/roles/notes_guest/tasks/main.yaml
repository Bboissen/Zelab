# One shared vault: every Hermes profile runs as zelab-hermes and sees all of it.
- name: Validate the guest mount path
  ansible.builtin.assert:
    that:
      - notes_guest_root is match('^/var/lib/[A-Za-z0-9_/-]+$')

- name: Install the standard guest SSHFS client
  ansible.builtin.apt:
    name: sshfs
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Prepare private native mount authentication
  ansible.builtin.file:
    path: /etc/zelab-notes
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Copy the private native mount key without rotating it
  ansible.builtin.copy:
    src: "{{ private_dir }}/notes-owner.key"
    dest: /etc/zelab-notes/owner.key
    owner: root
    group: root
    mode: '0600'
    force: false
  no_log: true
  diff: false

- name: Pin the trusted host notes listener key
  ansible.builtin.copy:
    dest: /etc/zelab-notes/known_hosts
    content: "[10.0.2.2]:{{ notes_sftp_port }} {{ lookup('ansible.builtin.file', '/etc/ssh/ssh_host_ed25519_key.pub') }}\n"
    owner: root
    group: root
    mode: '0600'

- name: Verify native SFTP authentication to the vault
  ansible.builtin.command:
    argv: [sftp, -q, -b, /dev/null, -P, "{{ notes_sftp_port }}", -i, /etc/zelab-notes/owner.key, -o, BatchMode=yes, -o, StrictHostKeyChecking=yes, -o, UserKnownHostsFile=/etc/zelab-notes/known_hosts, "{{ notes_owner_user }}@10.0.2.2"]
  changed_when: false

- name: Create an inaccessible unmounted destination without changing mounted notes
  ansible.builtin.command:
    argv: [install, -d, -m, '0700', "{{ notes_guest_root }}"]
    creates: "{{ notes_guest_root }}"

- name: Derive the canonical native SSHFS mount unit name
  ansible.builtin.command:
    argv: [systemd-escape, --path, --suffix=mount, "{{ notes_guest_root }}"]
  register: notes_guest_mount_name
  changed_when: false

- name: Install the persistent native SSHFS mount
  ansible.builtin.template:
    src: sshfs.mount.j2
    dest: "/etc/systemd/system/{{ notes_guest_mount_name.stdout | trim }}"
    owner: root
    group: root
    mode: '0644'
  register: notes_guest_unit

- name: Start and enable the vault mount
  ansible.builtin.systemd_service:
    name: "{{ notes_guest_mount_name.stdout | trim }}"
    state: "{{ 'restarted' if notes_guest_unit.changed else 'started' }}"
    enabled: true
    daemon_reload: "{{ notes_guest_unit.changed }}"
