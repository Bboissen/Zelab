# One project-scoped Paperclip task key per agent: created once, retained
# privately, never silently rotated, and proven by authenticating as itself.
- name: Inspect the retained private task credential
  ansible.builtin.stat:
    path: "{{ task_key_file }}"
  delegate_to: zelab_host
  register: task_key_retained

- name: Read the agent's native key metadata
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ paperclip_port }}/api/agents/{{ task_key_agent_id }}/keys"
    headers: {Cookie: "{{ task_key_owner_cookie }}"}
  delegate_to: zelab_host
  register: task_key_metadata
  no_log: true

- name: Resolve the declared active key
  ansible.builtin.set_fact:
    task_key_active: "{{ task_key_metadata.json | selectattr('name', 'equalto', task_key_name) | rejectattr('revokedAt') | list }}"
  no_log: true

- name: Refuse duplicate keys or accidental credential rotation
  ansible.builtin.assert:
    that:
      - task_key_active | length <= 1
      - task_key_retained.stat.exists == (task_key_active | length == 1)
    fail_msg: "Recover the retained {{ task_key_name }} credential or explicitly reconcile its key; do not silently rotate it."

- name: Require the exact project scope when reusing a key
  ansible.builtin.assert:
    that:
      - task_key_active[0].scope | zelab_exact_bridge_scope(task_key_project_id, task_key_assignees)
    fail_msg: "The retained {{ task_key_name }} key has unexpected authority; reconcile its complete native scope."
  when: task_key_retained.stat.exists
  no_log: true

- name: Create only a project-scoped task key
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ paperclip_port }}/api/agents/{{ task_key_agent_id }}/keys"
    method: POST
    body_format: json
    body:
      name: "{{ task_key_name }}"
      scope: >-
        {{ {'kind': 'task_bridge', 'projectIds': [task_key_project_id]}
           | combine({'allowedAssigneeAgentIds': task_key_assignees} if task_key_assignees else {}) }}
    headers: {Cookie: "{{ task_key_owner_cookie }}", Origin: "http://127.0.0.1:{{ paperclip_port }}"}
    status_code: 201
  delegate_to: zelab_host
  when: not task_key_retained.stat.exists
  register: task_key_created
  changed_when: true
  no_log: true

- name: Retain the one-time native credential privately
  ansible.builtin.copy:
    dest: "{{ task_key_file }}"
    content: "{{ task_key_created.json.token }}\n"
    owner: "{{ operator_user }}"
    mode: '0600'
  delegate_to: zelab_host
  when: task_key_created is not skipped
  no_log: true

- name: Authenticate the retained credential instead of trusting its filename
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ paperclip_port }}/api/agents/me"
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.file', task_key_file) }}"
    follow_redirects: none
  delegate_to: zelab_host
  register: task_key_identity
  no_log: true

- name: Require the actual key identity and complete effective scope
  ansible.builtin.assert:
    that:
      - task_key_identity.json | zelab_bridge_identity(task_key_company_id, task_key_agent_id, task_key_project_id, task_key_assignees)
    fail_msg: "The retained {{ task_key_name }} credential authenticates as an unexpected identity or scope."
  no_log: true
