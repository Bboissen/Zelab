- name: Read the retained native bridge identity before migration
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - -u
      - PAPERCLIP_AGENT_ID
      - "/opt/zelab-tools/node-v{{ node_version }}-linux-x64/bin/node"
      - --env-file=/var/lib/zelab/hermes/home/.env
      - -e
      - "process.stdout.write(process.env.PAPERCLIP_AGENT_ID || '')"
  become_user: zelab-hermes
  register: bridge_env_identity
  changed_when: false

- name: Recognize only the declared old or new submission identity
  ansible.builtin.assert:
    that: bridge_env_identity.stdout in [bridge_agent.id, bridge_workers.workers.ops.agent_id]
    fail_msg: Native bridge identity changed independently; reconcile it before migration.

- name: Verify every legacy environment field before updating it
  ansible.builtin.include_tasks: check-env.yaml
  vars:
    bridge_env_file: /var/lib/zelab/hermes/home/.env
    bridge_env_agent: "{{ bridge_workers.workers.ops.agent_id }}"
    bridge_env_company: "{{ bridge_workers.company_id }}"
    bridge_env_key_file: "{{ private_dir }}/paperclip-hermes-bridge.key"
  when: bridge_env_identity.stdout != bridge_agent.id

- name: Preserve unrelated native dotenv fields during credential migration
  ansible.builtin.slurp:
    src: /var/lib/zelab/hermes/home/.env
  register: bridge_migration_env
  when: bridge_env_identity.stdout != bridge_agent.id
  no_log: true

- name: Atomically replace the recognized old identity and credential together
  ansible.builtin.copy:
    dest: /var/lib/zelab/hermes/home/.env
    content: |
      {{ bridge_migration_env.content | b64decode | regex_replace('(?m)^[ \t]*(?:export[ \t]+)?PAPERCLIP_(AGENT_ID|BRIDGE_API_KEY|API_KEY)[ \t]*=.*$', '') }}
      PAPERCLIP_AGENT_ID={{ bridge_agent.id }}
      PAPERCLIP_BRIDGE_API_KEY={{ lookup('ansible.builtin.file', private_dir + '/paperclip-hermes-submission.key') }}
      PAPERCLIP_API_KEY=
    owner: zelab-hermes
    group: zelab-hermes
    mode: '0600'
  when: bridge_env_identity.stdout != bridge_agent.id
  no_log: true
  diff: false
