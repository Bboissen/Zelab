- name: Read native agents before selecting the submission identity
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ paperclip_port }}/api/companies/{{ bridge_workers.company_id }}/agents"
    headers: {Cookie: "{{ bridge_owner.cookies_string }}"}
  delegate_to: zelab_host
  register: bridge_agents

- name: Reject ambiguous submission identities
  ansible.builtin.assert:
    that: bridge_agents.json | selectattr('name', 'equalto', 'Zelab Operations submission') | list | length <= 1

- name: Create a native submission principal with no execution environment
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ paperclip_port }}/api/companies/{{ bridge_workers.company_id }}/agents"
    method: POST
    headers: {Cookie: "{{ bridge_owner.cookies_string }}", Origin: "http://127.0.0.1:{{ paperclip_port }}"}
    body_format: json
    body:
      name: Zelab Operations submission
      role: engineer
      adapterType: process
      adapterConfig: {command: /usr/bin/false}
      runtimeConfig:
        heartbeat: {enabled: false, wakeOnDemand: false, maxConcurrentRuns: 1}
      permissions: {canCreateAgents: false, canCreateSkills: false, canAssignTasks: true, trustPreset: standard}
    status_code: 201
  delegate_to: zelab_host
  register: bridge_agent_created
  when: bridge_agents.json | selectattr('name', 'equalto', 'Zelab Operations submission') | list | length == 0
  changed_when: true

- name: Resolve the retained native submission principal
  ansible.builtin.set_fact:
    bridge_agent: "{{ bridge_agent_created.json if bridge_agent_created is not skipped else (bridge_agents.json | selectattr('name', 'equalto', 'Zelab Operations submission') | first) }}"

- name: Retain the native submission identity for read-only readiness checks
  ansible.builtin.copy:
    dest: "{{ private_dir }}/paperclip-bridge-ids.json"
    content: "{{ {'company_id': bridge_workers.company_id, 'agent_id': bridge_agent.id, 'project_id': bridge_workers.workers.ops.project_id, 'assignee_agent_id': bridge_workers.workers.ops.agent_id} | to_nice_json }}\n"
    owner: "{{ operator_user }}"
    mode: '0600'
  delegate_to: zelab_host

- name: Require an inert submission principal rather than a second host worker
  ansible.builtin.assert:
    that:
      - bridge_agent | zelab_submission_contract(bridge_workers.company_id)
    fail_msg: The submission principal must remain inert and separate from all execution identities.

- name: Read legacy Operations keys before migration
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ paperclip_port }}/api/agents/{{ bridge_workers.workers.ops.agent_id }}/keys"
    headers: {Cookie: "{{ bridge_owner.cookies_string }}"}
  delegate_to: zelab_host
  register: bridge_legacy_keys

- name: Resolve the original managed worker credential
  ansible.builtin.set_fact:
    bridge_legacy_active: "{{ bridge_legacy_keys.json | selectattr('name', 'equalto', 'Zelab Hermes Operations task bridge') | rejectattr('revokedAt') | list }}"

- name: Check legacy work before changing its credential
  ansible.builtin.include_tasks: legacy-work.yaml

- name: Resolve native gateway supervision for the one-time migration
  ansible.builtin.include_role:
    name: hermes_service_identity
  when: bridge_legacy_active | length > 0

- name: Pause the gateway while retiring its old submission identity
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ hermes_gateway_unit }}"
    state: stopped
  become_user: zelab-hermes
  environment:
    XDG_RUNTIME_DIR: /run/user/61102
    DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/61102/bus
  register: bridge_migration_pause
  when: bridge_legacy_active | length > 0

- name: Recheck work after stopping concurrent legacy submissions
  ansible.builtin.include_tasks: legacy-work.yaml
  when: bridge_legacy_active | length > 0
