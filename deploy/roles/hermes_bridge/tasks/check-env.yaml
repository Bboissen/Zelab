- name: Read only the effective native bridge fields without logging them
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - -u
      - PAPERCLIP_API_URL
      - -u
      - PAPERCLIP_BRIDGE_API_KEY
      - -u
      - PAPERCLIP_API_KEY
      - -u
      - PAPERCLIP_AGENT_ID
      - -u
      - PAPERCLIP_COMPANY_ID
      - "/opt/zelab-tools/node-v{{ node_version }}-linux-x64/bin/node"
      - "--env-file={{ bridge_env_file }}"
      - -e
      - >-
        process.stdout.write(JSON.stringify(Object.fromEntries(
        ['PAPERCLIP_API_URL','PAPERCLIP_BRIDGE_API_KEY','PAPERCLIP_API_KEY',
        'PAPERCLIP_AGENT_ID','PAPERCLIP_COMPANY_ID'].map(k=>[k,process.env[k]||'']))))
  become_user: zelab-hermes
  register: bridge_effective_env
  changed_when: false
  no_log: true

- name: Require the retained environment to target the declared native bridge
  ansible.builtin.assert:
    that:
      - effective.PAPERCLIP_API_URL == 'http://10.0.2.2:' + (paperclip_port | string)
      - effective.PAPERCLIP_AGENT_ID == bridge_env_agent
      - effective.PAPERCLIP_COMPANY_ID == bridge_env_company
      - effective.PAPERCLIP_BRIDGE_API_KEY == lookup('ansible.builtin.file', bridge_env_key_file)
      - effective.PAPERCLIP_API_KEY in ['', effective.PAPERCLIP_BRIDGE_API_KEY]
    fail_msg: Retained bridge destination or credentials drifted; reconcile the native environment without disclosing keys.
  vars:
    effective: "{{ bridge_effective_env.stdout | from_json }}"
  no_log: true
