# Same check as main.yaml for several profiles at once. Each starts the native
# runtime, so they run in parallel. checked_profiles: [{home, tool_user}]
- name: Install the profile check once per run
  ansible.builtin.include_tasks: install.yaml
  when: hermes_profile_check_installed is not defined

- name: Start native profile admission checks in parallel
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/lib/zelab/check_profile.py
      - "{{ hermes_install_dir }}"
      - "{{ research_initial_allowed_user }}"
      - "{{ item.tool_user | default('') }}"
      - "{{ checked_skip_parked | bool | ternary('skip-parked', 'check') }}"
  become_user: zelab-hermes
  environment: "{{ hermes_cli_environment | combine({'HERMES_HOME': item.home}) }}"
  async: 600
  poll: 0
  loop: "{{ checked_profiles }}"
  loop_control:
    label: "{{ item.home | basename }}"
  register: checked_profile_jobs
  changed_when: false
  no_log: true

- name: Wait for the native profile admission checks
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  become_user: zelab-hermes
  loop: "{{ checked_profile_jobs.results }}"
  loop_control:
    label: "{{ item.item.home | basename }}"
  register: checked_profiles_done
  until: checked_profiles_done.finished
  retries: 200
  delay: 2
  failed_when: false
  no_log: true

- name: Remove the finished admission check job records
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
    mode: cleanup
  become_user: zelab-hermes
  loop: "{{ checked_profile_jobs.results }}"
  loop_control:
    label: "{{ item.item.home | basename }}"

- name: Require retained owner admission in every checked profile
  ansible.builtin.assert:
    that: item.rc | default(1) == 0
    fail_msg: "{{ hermes_admission_message | replace('PROFILE', item.item.item.home) }}"
  loop: "{{ checked_profiles_done.results }}"
  loop_control:
    label: "{{ item.item.item.home | basename }}"
