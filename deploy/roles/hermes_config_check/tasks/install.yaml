# Installed once per run so checks run as commands: no per-call script upload,
# and batch.yaml can run several in parallel.
- name: Prepare the deployment check directory
  ansible.builtin.file:
    path: /usr/local/lib/zelab
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the read-only native profile check
  ansible.builtin.copy:
    src: check_profile.py
    dest: /usr/local/lib/zelab/check_profile.py
    owner: root
    group: root
    mode: '0644'

- name: Remember that the profile check is installed for this run
  ansible.builtin.set_fact:
    hermes_profile_check_installed: true
