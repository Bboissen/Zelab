- name: Install the profile check once per run
  ansible.builtin.include_tasks: install.yaml
  when: hermes_profile_check_installed is not defined

- name: Inspect native profile admission without modifying runtime state
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/lib/zelab/check_profile.py
      - "{{ hermes_install_dir }}"
      - "{{ research_initial_allowed_user }}"
      - "{{ checked_tool_user }}"
      - "{{ checked_skip_parked | bool | ternary('skip-parked', 'check') }}"
  become_user: zelab-hermes
  environment: "{{ hermes_cli_environment | combine({'HERMES_HOME': checked_profile_home}) }}"
  register: checked_profile
  changed_when: false
  failed_when: false
  no_log: true

- name: Require retained owner admission before activating a shared runtime
  ansible.builtin.assert:
    that: checked_profile.rc == 0
    fail_msg: "{{ hermes_admission_message | replace('PROFILE', checked_profile_home) }}"
