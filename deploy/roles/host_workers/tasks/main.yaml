- name: Require a distinct fresh worker identity
  ansible.builtin.assert:
    that:
      - worker_ops_user not in [operator_user, paperclip_user, 'root', 'zelab-deploy']

- name: Inspect the native SSH runner Node prerequisite
  ansible.builtin.stat:
    path: /usr/local/bin/node
    follow: false
  register: worker_node_command

- name: Preserve any independently managed system Node command
  ansible.builtin.assert:
    that: not worker_node_command.stat.exists or (worker_node_command.stat.islnk and worker_node_command.stat.lnk_source.startswith('/opt/zelab-tools/node-v'))

- name: Expose the declared pinned Node prerequisite to native SSH runner commands
  ansible.builtin.file:
    src: "/opt/zelab-tools/node-v{{ node_version }}-linux-x64/bin/node"
    dest: /usr/local/bin/node
    state: link
    owner: root
    group: root

- name: Inspect existing SSH access before adding worker identities
  ansible.builtin.command:
    argv: [rtk, proxy, /usr/sbin/sshd, -T, -C, "user={{ operator_user }},addr={{ worker_ssh_host }},host={{ worker_ssh_host }},lport={{ worker_ssh_port }},laddr={{ worker_ssh_host }}"]
  register: worker_ssh_before
  changed_when: false

- name: Prepare explicitly configured native worker notes groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
  loop: ["{{ notes_owner_group | default('zelab-vault-owner') }}", "{{ notes_shared_group | default('zelab-vault-shared') }}"]
  when: notes_enabled | default(false) | bool

- name: Create the native Operations worker account without administrator groups
  ansible.builtin.user:
    name: "{{ worker_ops_user }}"
    home: "{{ worker_ops_home }}"
    shell: /bin/bash
    system: true
    create_home: true
    groups: "{{ (notes_owner_group | default('zelab-vault-owner')) + ',' + (notes_shared_group | default('zelab-vault-shared')) if notes_enabled | default(false) | bool else '' }}"
    append: false

- name: Restrict the worker home and SSH directories
  ansible.builtin.file:
    path: "{{ worker_ops_home }}{{ item }}"
    state: directory
    owner: "{{ worker_ops_user }}"
    group: "{{ worker_ops_user }}"
    mode: '0700'
  loop: ['', /.ssh, /workspace]

- name: Preserve retained native worker keys
  ansible.builtin.include_role:
    name: retained_secrets
  vars:
    retained_secrets:
      - {installed: "{{ worker_ops_home }}/.ssh/authorized_keys", source: "{{ private_dir }}/worker-ops.key"}

- name: Generate a persistent worker key outside Git
  ansible.builtin.command:
    argv: [rtk, proxy, ssh-keygen, -q, -t, ed25519, -N, '', -C, zelab-ops-worker, -f, "{{ private_dir }}/worker-ops.key"]
    creates: "{{ private_dir }}/worker-ops.key"
  become: false
  no_log: true

- name: Authorize only host-origin worker SSH without forwarding or PTY
  ansible.builtin.lineinfile:
    path: "{{ worker_ops_home }}/.ssh/authorized_keys"
    line: "from=\"{{ worker_ssh_host }}\",restrict {{ lookup('ansible.builtin.file', private_dir + '/worker-ops.key.pub') }}"
    create: true
    owner: "{{ worker_ops_user }}"
    group: "{{ worker_ops_user }}"
    mode: '0600'

- name: Give only designated Operations unattended native sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/zelab-worker-operations
    content: "{{ worker_ops_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Extend an existing SSH allowlist without restricting an open host
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/05-zelab-workers.conf
    content: |
      # Worker keys enforce source restrictions and disable forwarding.
      {% if worker_ssh_before.stdout_lines | select('match', '^allowusers ') | list %}
      AllowUsers {{ worker_ops_user }}@{{ worker_ssh_host }}
      {% endif %}
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  register: worker_ssh_config

- name: Validate complete SSH configuration before reload
  ansible.builtin.command:
    argv: [rtk, proxy, /usr/sbin/sshd, -t]
  changed_when: false

- name: Inspect effective owner policy after worker addition
  ansible.builtin.command:
    argv: [rtk, proxy, /usr/sbin/sshd, -T, -C, "user={{ operator_user }},addr={{ worker_ssh_host }},host={{ worker_ssh_host }},lport={{ worker_ssh_port }},laddr={{ worker_ssh_host }}"]
  register: worker_ssh_after
  changed_when: false

- name: Require existing listeners and owner policy to remain intact
  ansible.builtin.assert:
    that:
      - (worker_ssh_before.stdout_lines | reject('match', '^allowusers ') | list) == (worker_ssh_after.stdout_lines | reject('match', '^allowusers ') | list)
      - (worker_ssh_before.stdout_lines | select('match', '^allowusers ') | join(' ') | split(' ')) | difference(worker_ssh_after.stdout_lines | select('match', '^allowusers ') | join(' ') | split(' ')) | length == 0

- name: Reload native SSH with existing sessions preserved
  ansible.builtin.systemd_service:
    name: ssh.service
    state: reloaded
  when: worker_ssh_config.changed

- name: Pin the worker host key from trusted local host configuration
  ansible.builtin.copy:
    dest: "{{ private_dir }}/worker_known_hosts"
    content: "{{ worker_host_key_name }} {{ lookup('ansible.builtin.file', '/etc/ssh/ssh_host_ed25519_key.pub') }}\n"
    owner: "{{ operator_user }}"
    mode: '0600'
  vars:
    worker_host_key_name: "{{ worker_ssh_host if worker_ssh_port | int == 22 else '[' + worker_ssh_host + ']:' + (worker_ssh_port | string) }}"

- name: Prepare the native coordinator subscription source home
  ansible.builtin.file:
    path: "{{ paperclip_home }}/.codex"
    state: directory
    owner: "{{ paperclip_user }}"
    group: "{{ paperclip_user }}"
    mode: '0700'
  when: worker_harness == 'codex'

- name: Check whether the operator has completed native Codex login
  ansible.builtin.stat:
    path: "{{ worker_codex_auth_source }}"
  register: worker_codex_login
  no_log: true
  when: worker_harness == 'codex'

- name: Report a pending Codex login without blocking installation
  ansible.builtin.debug:
    msg: "PENDING: run `/usr/local/bin/zelab-codex login --device-auth` as {{ operator_user }}, then rerun make before using a Codex worker."
  when: worker_harness == 'codex' and not (worker_codex_login.stat.isreg | default(false))

- name: Import preserved subscription login once without owner configuration or secrets
  when: worker_harness == 'codex' and (worker_codex_login.stat.isreg | default(false))
  ansible.builtin.copy:
    src: "{{ worker_codex_auth_source }}"
    dest: "{{ paperclip_home }}/.codex/auth.json"
    remote_src: true
    owner: "{{ paperclip_user }}"
    group: "{{ paperclip_user }}"
    mode: '0600'
    force: false
  no_log: true
  diff: false
- name: Install only the selected native worker harness
  ansible.builtin.include_role:
    name: "{{ worker_harness }}"
