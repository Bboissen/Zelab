hermes_profile_name: research
research_tool_user: zelab-research-tools
research_tool_uid: 61110
research_tool_home: /var/lib/zelab-research-tools
research_profile_dir: "/var/lib/zelab/hermes/home/profiles/{{ hermes_profile_name }}"
research_profile_description: Public research with separate unprivileged SSH tools
# A shared Hermes runtime UID is not a family security boundary. Activate a new
# profile explicitly through native Hermes after reviewing audience and tools.
research_profile_parked: true
research_tool_groups: "{{ ['zelab-notes-shared'] if hermes_profile_name in (notes_shared_profiles | default([])) else [] }}"
research_disabled_toolsets: [browser, code_execution, vision, video, image_gen, video_gen, x_search, tts, stt, skills, todo, kanban, context_engine, session_search, connections, delegation, cronjob, discord, discord_admin, yuanbao, computer_use]
# bot-pool.yaml creates missing reserve profiles together, then applies this
# role to each; only a slot it just created may exist without its seed marker.
research_profile_precreated: false
# Install-wide steps (search dependency, guest host-key pin) run once, in the
# Research play; the reserve loop skips them.
research_install_shared: true
# bot-pool.yaml checks all reserves together after the loop instead.
research_defer_admission_check: false
