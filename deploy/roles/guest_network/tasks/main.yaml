- name: Require the existing native guest firewall tool
  ansible.builtin.command: /usr/sbin/nft --version
  changed_when: false

- name: Install native guest egress configuration
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/nft -c -f %s
  register: guest_firewall

- name: Keep the boundary in place during firewall service restarts
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: '0755'

- name: Clear native stop-time ruleset flushing
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/zelab.conf
    content: "[Service]\nExecStop=\n"
    owner: root
    group: root
    mode: '0644'

- name: Apply and enable guest firewall
  ansible.builtin.systemd_service:
    name: nftables.service
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if guest_firewall.changed else 'started' }}"
