# Started early by prefetch.yaml so the download overlaps guest installation.
- name: Inspect the immutable container input
  ansible.builtin.command:
    argv: [rtk, proxy, docker, image, inspect, "{{ obsidian_image }}", --format, '{{ "{{.Id}}" }}']
  register: obsidian_existing_image
  failed_when: obsidian_existing_image.rc not in [0, 1]
  changed_when: false

- name: Preserve the host disk and RAM reserves before a new image pull
  ansible.builtin.command:
    argv:
      - rtk
      - proxy
      - python3
      - "{{ playbook_dir }}/files/check_headroom.py"
      - docker
      - "{{ '0' if obsidian_existing_image.rc == 0 else '4' }}"
      - '2048'
      - "{{ host_disk_reserve_gib | default(20) | string }}"
      - "{{ host_memory_reserve_gib | default(8) | string }}"
      - the Obsidian container
      - Free space in Docker storage.
      - Stop other workloads.
  register: obsidian_resources
  changed_when: false

- name: Report reduced host headroom without blocking installation
  ansible.builtin.debug:
    msg: "WARNING: {{ obsidian_resources.stdout }}"
  when: obsidian_resources.stdout | length > 0

# The image is pinned by digest, so a present image is already the right one.
- name: Pull the checksum-pinned upstream browser container in the background
  ansible.builtin.command:
    argv: [rtk, proxy, docker, pull, "{{ obsidian_image }}"]
  async: 3600
  poll: 0
  register: obsidian_pull_job
  when: obsidian_existing_image.rc != 0
