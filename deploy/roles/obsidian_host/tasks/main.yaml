- name: Validate the explicit Obsidian endpoint and private state
  ansible.builtin.assert:
    that:
      - obsidian_enabled | default(false) | bool
      - obsidian_username is match('^[A-Za-z0-9_-]+$')
      - obsidian_state_dir is match('^/[A-Za-z0-9_./-]+$')
      - obsidian_config_dir is match('^/etc/[A-Za-z0-9_/-]+$')
      - obsidian_backend_port | int > 1024
      - obsidian_backend_port | int not in [guest_dashboard_port | int, guest_api_port | int, paperclip_port | int]

- name: Read the prepared native vault identity
  ansible.builtin.command:
    argv: [python3, -c, "import pwd,grp,sys; p=pwd.getpwnam(sys.argv[1]); print(str(p.pw_uid)+':'+str(grp.getgrnam(sys.argv[2]).gr_gid))", "{{ notes_container_user }}", "{{ notes_owner_group }}"]
  register: obsidian_identity
  changed_when: false

- name: Start the image pull unless an earlier play already did
  ansible.builtin.include_tasks: pull.yaml
  when: obsidian_pull_job is not defined

- name: Wait for the checksum-pinned upstream browser container
  ansible.builtin.async_status:
    jid: "{{ obsidian_pull_job.ansible_job_id }}"
  register: obsidian_pull
  until: obsidian_pull.finished
  retries: 1200
  delay: 3
  changed_when: "'Downloaded newer image' in obsidian_pull.stdout | default('')"
  when: obsidian_pull_job is not skipped

- name: Remove the finished pull job record
  ansible.builtin.async_status:
    jid: "{{ obsidian_pull_job.ansible_job_id }}"
    mode: cleanup
  when: obsidian_pull_job is not skipped

- name: Prepare private native browser state
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ notes_container_user }}"
    group: "{{ obsidian_identity.stdout.split(':')[1] }}"
    mode: '0700'
  loop: ["{{ obsidian_state_dir }}", "{{ obsidian_state_dir }}/config"]

- name: Prepare native Compose configuration
  ansible.builtin.file:
    path: "{{ obsidian_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Inspect the retained root-owned native browser password
  ansible.builtin.stat:
    path: "{{ obsidian_config_dir }}/password"
    get_checksum: false
    follow: false
  register: obsidian_password_installed
  no_log: true

- name: Supply the native FILE__PASSWORD secret without printing it
  ansible.builtin.copy:
    src: "{{ zelab_password_dir | default(private_dir) }}/obsidian.password"
    dest: "{{ obsidian_config_dir }}/password"
    owner: root
    group: root
    mode: '0600'
    force: false
  when: not obsidian_password_installed.stat.exists
  no_log: true
  diff: false

- name: Require a regular native password file with root-only permissions
  ansible.builtin.file:
    path: "{{ obsidian_config_dir }}/password"
    state: file
    owner: root
    group: root
    mode: '0600'
  when: not obsidian_password_installed.stat.exists or obsidian_password_installed.stat.isreg | default(false)
  no_log: true

- name: Refuse a symlink or other unsafe existing browser password input
  ansible.builtin.assert:
    that: not obsidian_password_installed.stat.exists or obsidian_password_installed.stat.isreg | default(false)
    fail_msg: Recover the root-owned native Obsidian password file; symlinks are not accepted.

- name: Install the conventional Obsidian Compose definition
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compose.yaml"
    dest: "{{ obsidian_config_dir }}/compose.yaml"
    owner: root
    group: root
    mode: '0644'

- name: Configure only native container inputs and secret paths
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ obsidian_config_dir }}/compose.env"
    owner: root
    group: root
    mode: '0600'

- name: Validate native Compose without rendering secrets
  ansible.builtin.command:
    argv: "{{ obsidian_compose + ['config', '--quiet'] }}"
  changed_when: false

- name: Inspect native first-run vault registration
  ansible.builtin.stat:
    path: "{{ obsidian_state_dir }}/config/.config/obsidian/obsidian.json"
  register: obsidian_preferences

- name: Stop an uninitialized browser before the one-time native settings seed
  ansible.builtin.command:
    argv: "{{ obsidian_compose + ['stop', 'obsidian'] }}"
  register: obsidian_initial_stop
  changed_when: "'Stopped' in obsidian_initial_stop.stderr"
  when: not obsidian_preferences.stat.exists

- name: Register only the initial server vault in native Obsidian preferences
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import pathlib,json,secrets,os,sys
        path=pathlib.Path(sys.argv[1]);uid,gid=map(int,sys.argv[2:])
        path.parent.mkdir(parents=True,exist_ok=True)
        state=json.loads(path.read_text()) if path.exists() else {}
        if state.get('vaults'):
            raise SystemExit('A native vault appeared during bootstrap; adopt its settings explicitly.')
        state['vaults']={secrets.token_hex(8):{'path':'/vault','ts':0,'open':True}}
        state['updateDisabled']=True
        path.write_text(json.dumps(state)+'\n');path.chmod(0o600);os.chown(path,uid,gid)
      - "{{ obsidian_state_dir }}/config/.config/obsidian/obsidian.json"
      - "{{ obsidian_identity.stdout.split(':')[0] }}"
      - "{{ obsidian_identity.stdout.split(':')[1] }}"
  when: not obsidian_preferences.stat.exists

- name: Activate only the dedicated browser container
  ansible.builtin.command:
    argv: "{{ obsidian_compose + ['up', '-d', 'obsidian'] }}"
  register: obsidian_start
  changed_when: "'Started' in obsidian_start.stderr or 'Created' in obsidian_start.stderr or 'Recreated' in obsidian_start.stderr"

- name: Require native authentication before adding remote access
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ obsidian_backend_port }}/"
    status_code: 401
  register: obsidian_auth
  until: obsidian_auth.status == 401
  retries: 20
  delay: 3

- name: Verify the retained native browser login without revealing its password
  ansible.builtin.slurp:
    src: "{{ obsidian_config_dir }}/password"
  register: obsidian_runtime_password
  no_log: true

- name: Require successful native browser authentication
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ obsidian_backend_port }}/"
    url_username: "{{ obsidian_username }}"
    url_password: "{{ obsidian_runtime_password.content | b64decode | trim }}"
    force_basic_auth: true
    follow_redirects: none
    status_code: 200
  no_log: true

- name: Inspect any transient browser password before recovery-copy cleanup
  ansible.builtin.stat:
    path: "{{ zelab_password_dir }}/obsidian.password"
    get_checksum: false
  register: obsidian_password_input
  when: zelab_password_dir is defined
  no_log: true

- name: Verify the deployment recovery copy matches the retained browser login
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ obsidian_backend_port }}/"
    url_username: "{{ obsidian_username }}"
    url_password: "{{ lookup('ansible.builtin.file', zelab_password_dir + '/obsidian.password') }}"
    force_basic_auth: true
    follow_redirects: none
    status_code: 200
  when: zelab_password_dir is defined and obsidian_password_input.stat.exists | default(false)
  no_log: true
