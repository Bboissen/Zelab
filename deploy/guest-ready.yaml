- name: Verify guest administrator reachability
  hosts: guest
  gather_facts: false
  become: true
  tasks:
    - name: Wait for native SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Check real administrator identity
      ansible.builtin.command: id -u
      register: administrator
      changed_when: false
    - name: Require actual guest root
      ansible.builtin.assert:
        that: administrator.stdout == '0'
    - name: Wait for the fresh guest's native cloud-init completion
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
    # cloud-init grows the root filesystem at boot; this covers a live resize.
    - name: Grow the root partition and filesystem to the disk size online
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, re, subprocess
            source = subprocess.run(['findmnt', '-no', 'SOURCE', '/'], check=True, capture_output=True, text=True).stdout.strip()
            disk, part = re.fullmatch(r'(/dev/[a-z]+)(\d+)', source).groups()
            grown = subprocess.run(['growpart', disk, part], capture_output=True, text=True)
            if grown.returncode not in (0, 1) or (grown.returncode == 1 and 'NOCHANGE' not in grown.stdout):
                raise SystemExit('growpart failed: ' + (grown.stdout + grown.stderr).strip()[-300:])
            if grown.returncode == 0:
                subprocess.run(['resize2fs', source], check=True, capture_output=True)
            print(json.dumps({'changed': grown.returncode == 0}))
      register: guest_root_grown
      changed_when: (guest_root_grown.stdout | from_json).changed
    - name: Allow a terminal for the deployment key on guests created before it was permitted
      ansible.builtin.lineinfile:
        path: "/home/{{ guest_user }}/.ssh/authorized_keys"
        regexp: '^restrict,(pty,)?from="10\.0\.2\.2" {{ (lookup("ansible.builtin.file", deploy_key + ".pub").split())[1] | regex_escape }}'
        line: 'restrict,pty,from="10.0.2.2" {{ lookup("ansible.builtin.file", deploy_key + ".pub") }}'
        firstmatch: true
    - name: Verify locked guest accounts and effective SSH password denial
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import subprocess, sys
            for user in (sys.argv[1], 'root'):
                result = subprocess.run(['passwd', '-S', user], check=True, capture_output=True, text=True)
                if result.stdout.split()[1] not in ('L', 'LK'):
                    raise SystemExit('Guest deployment and root accounts must have locked passwords.')
            result = subprocess.run(['/usr/sbin/sshd', '-T', '-C',
                                     'user=' + sys.argv[1] + ',addr=10.0.2.2,host=10.0.2.2'],
                                    check=True, capture_output=True, text=True)
            settings = dict(line.split(' ', 1) for line in result.stdout.splitlines())
            if settings.get('passwordauthentication') != 'no' or settings.get('kbdinteractiveauthentication') != 'no':
                raise SystemExit('Guest SSH password and keyboard-interactive authentication must be disabled.')
            print('Guest deployment/root passwords locked; SSH password login disabled.')
          - "{{ guest_user }}"
      changed_when: false
