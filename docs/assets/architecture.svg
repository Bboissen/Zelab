<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1090" role="img" aria-labelledby="title description">
  <title id="title">Zelab: bots in a VM, coding and execution on the host</title>
  <desc id="description">The VM contains Hermes bots and optional Paperclip MCP ticket tools. On the Linux host, Paperclip dispatches the coding team, whose host accounts edit repositories, build and test code, run commands and manage services according to their tier rights. Saving project notes to the shared vault is a separate, secondary output. Bots can write notes directly over SFTP without a ticket. Paperclip can also start bot runs back in the VM. On-demand private Git sync connects the vault to desktop Obsidian on a laptop.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker>
    <marker id="work-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#0f766e"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 19px; fill: #475569; }
      .tag { font-size: 20px; font-weight: 700; letter-spacing: .6px; }
      .node { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .work { fill: none; stroke: #0f766e; stroke-width: 3; marker-end: url(#work-arrow); }
      .label { font-size: 18px; font-weight: 600; paint-order: stroke; stroke: #f1f5f9; stroke-width: 7px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="1090" rx="18" fill="#f8fafc"/>

  <rect class="node" x="149" y="32" width="300" height="84" rx="12"/>
  <text x="173" y="68" class="heading">Your chat</text>
  <text x="173" y="98" class="body">Discord, Telegram, …</text>
  <rect class="node" x="774" y="32" width="300" height="84" rx="12"/>
  <text x="798" y="68" class="heading">Your browser</text>
  <text x="798" y="98" class="body">Private dashboards</text>

  <rect x="32" y="180" width="1136" height="720" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
  <text x="610" y="222" class="tag">HOST · LINUX SERVER</text>

  <rect x="64" y="260" width="470" height="370" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <text x="88" y="300" class="tag" style="fill: #1d4ed8">VM · KVM GUEST</text>
  <rect class="node" x="96" y="340" width="406" height="108" rx="12"/>
  <text x="120" y="380" class="heading">Hermes bots</text>
  <text x="120" y="414" class="body">Chat, research &amp; direct notes</text>
  <rect class="node" x="300" y="510" width="202" height="70" rx="12"/>
  <text x="320" y="540" class="heading">MCP tickets</text>
  <text x="320" y="566" class="body">Optional</text>
  <text x="230" y="616" class="body">One shared guest account</text>

  <rect class="node" x="744" y="300" width="360" height="88" rx="12"/>
  <text x="768" y="336" class="heading">Paperclip</text>
  <text x="768" y="368" class="body">Assigns &amp; tracks tasks</text>
  <rect x="744" y="452" width="360" height="134" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="768" y="490" class="heading">Coding team · ON HOST</text>
  <text x="768" y="524" class="body">Claude Code / Codex</text>
  <text x="768" y="556" class="body">Runs commands as host accounts</text>

  <rect x="744" y="660" width="360" height="150" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="768" y="700" class="heading">Host code &amp; services</text>
  <text x="768" y="738" class="body">Edit project repositories</text>
  <text x="768" y="772" class="body">Build, test &amp; manage services</text>

  <rect class="node" x="96" y="740" width="548" height="130" rx="12"/>
  <text x="120" y="780" class="heading">Shared notes vault</text>
  <text x="120" y="815" class="body">Research, plans &amp; results</text>
  <text x="120" y="847" class="body">Markdown notes · both bots and team can write</text>

  <path class="flow" d="M299 116V340" marker-start="url(#arrow)"/>
  <path class="flow" d="M924 116V300"/>
  <text x="940" y="160" class="label">Tailnet access</text>
  <path class="flow" d="M400 448V510"/>
  <path class="flow" d="M502 545H630V344H744"/>
  <text x="630" y="530" class="label" text-anchor="middle">Tickets</text>
  <path class="flow" d="M744 320H470V340"/>
  <text x="620" y="305" class="label" text-anchor="middle">Bot runs</text>
  <path class="work" d="M924 388V452"/>
  <text x="940" y="426" class="label">Dispatch</text>
  <path class="work" d="M924 586V660"/>
  <text x="940" y="630" class="label" style="fill: #0f766e">Code &amp; execute</text>
  <path class="flow" d="M180 448V740" marker-start="url(#arrow)"/>
  <text x="196" y="690" class="label">Direct notes · SFTP</text>
  <path class="flow" d="M744 520H716V706H440V740" stroke-dasharray="6 5"/>
  <text x="575" y="692" class="label" text-anchor="middle">Write project notes</text>

  <rect class="node" x="96" y="968" width="450" height="88" rx="12"/>
  <text x="120" y="1004" class="heading">Desktop Obsidian</text>
  <text x="120" y="1034" class="body">Your laptop · notes only</text>
  <rect class="node" x="744" y="968" width="360" height="88" rx="12"/>
  <text x="768" y="1004" class="heading">Private Git notes repo</text>
  <text x="768" y="1034" class="body">Sync on demand</text>
  <path class="flow" d="M600 870V930H924V968" marker-start="url(#arrow)"/>
  <text x="762" y="918" class="label" text-anchor="middle">make notes</text>
  <path class="flow" d="M744 1012H546" marker-start="url(#arrow)"/>
  <text x="645" y="995" class="label" text-anchor="middle">pull / push</text>
</svg>
