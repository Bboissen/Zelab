<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 900" role="img" aria-labelledby="title description">
  <title id="title">Zelab: ask, work and keep the results</title>
  <desc id="description">Chat reaches Hermes bots in a guest. Each keyed bot uses the official Paperclip MCP server to file and read tickets; host Paperclip starts bot runs through a separate API and sends coding work to host team accounts. Bots and team write the same host notes vault. Root-only history keeps earlier versions. Deliberate private Git sync brings notes to optional desktop Obsidian on the laptop. Blue links are encrypted; amber links use local HTTP; grey links are local tools or files. Desktop Obsidian is not a server service.</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#2563eb"/></marker>
    <marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#a16207"/></marker>
    <marker id="grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 24px; font-weight: 700; }
      .role { font-size: 19px; fill: #475569; }
      .small { font-size: 16px; fill: #475569; }
      .tag { font-size: 16px; font-weight: 700; letter-spacing: 1.4px; }
      .encrypted { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#blue); }
      .http { fill: none; stroke: #a16207; stroke-width: 2.5; marker-end: url(#amber); }
      .local { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#grey); }
      .label { font-size: 16px; font-weight: 600; paint-order: stroke; stroke: #f8fafc; stroke-width: 7px; stroke-linejoin: round; }
      .node { fill: white; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1160" height="900" rx="18" fill="#f8fafc"/>

  <rect class="node" x="70" y="40" width="260" height="95" rx="12"/>
  <text x="90" y="78" class="heading">Your chat</text>
  <text x="90" y="110" class="role">Ask for work</text>
  <rect class="node" x="450" y="40" width="280" height="95" rx="12"/>
  <text x="470" y="78" class="heading">Your browser</text>
  <text x="470" y="110" class="role">Review &amp; assign work</text>
  <text x="850" y="81" class="tag">ASK → WORK → KEEP</text>
  <text x="850" y="110" class="small">Main work and notes flows</text>

  <rect x="30" y="190" width="1100" height="475" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="224" class="tag">YOUR SERVER</text>
  <rect x="50" y="250" width="300" height="350" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="276" class="tag" fill="#1d4ed8">BOT GUEST</text>

  <rect class="node" x="70" y="300" width="260" height="95" rx="12"/>
  <text x="90" y="338" class="heading">Hermes bots</text>
  <text x="90" y="370" class="role">Talk, research &amp; reply</text>
  <rect class="node" x="70" y="455" width="260" height="80" rx="12"/>
  <text x="90" y="489" class="heading">Paperclip MCP</text>
  <text x="90" y="516" class="role">File &amp; read tickets</text>
  <text x="70" y="578" class="small">Profiles share one account</text>

  <rect x="450" y="210" width="280" height="45" rx="10" fill="#dbeafe"/>
  <text x="590" y="239" class="small" text-anchor="middle">Private HTTPS + sign-in</text>
  <rect class="node" x="450" y="300" width="280" height="95" rx="12"/>
  <text x="470" y="338" class="heading">Paperclip</text>
  <text x="470" y="370" class="role">Organise tasks &amp; results</text>
  <rect x="850" y="300" width="260" height="95" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="870" y="338" class="heading">Coding team</text>
  <text x="870" y="370" class="role">Build &amp; maintain server</text>

  <rect class="node" x="450" y="535" width="280" height="95" rx="12"/>
  <text x="470" y="573" class="heading">Shared notes</text>
  <text x="470" y="605" class="role">Keep project knowledge</text>
  <rect class="node" x="850" y="535" width="260" height="95" rx="12"/>
  <text x="870" y="566" class="heading">Note history</text>
  <text x="870" y="594" class="role">Recover earlier versions</text>
  <text x="870" y="617" class="small">Root only · every 5 min</text>

  <rect class="node" x="450" y="745" width="280" height="100" rx="12"/>
  <text x="470" y="779" class="heading">Desktop Obsidian</text>
  <text x="470" y="807" class="role">Read &amp; edit notes</text>
  <text x="470" y="831" class="small">Your laptop · optional</text>
  <rect class="node" x="850" y="745" width="260" height="100" rx="12"/>
  <text x="870" y="779" class="heading">Private notes repo</text>
  <text x="870" y="807" class="role">Carry notes to your laptop</text>
  <text x="870" y="831" class="small">GitHub · separate from source</text>

  <path class="encrypted" d="M200 135V300" marker-start="url(#blue)"/>
  <text x="214" y="174" class="label" fill="#2563eb">TLS</text>
  <path class="encrypted" d="M590 135V210"/>
  <path class="http" d="M590 255V300"/>
  <text x="604" y="284" class="label" fill="#a16207">Local HTTP</text>

  <path class="http" d="M450 342H330"/>
  <text x="390" y="328" class="label" text-anchor="middle" fill="#a16207">Run · key</text>
  <path class="local" d="M200 395V455"/>
  <path class="http" d="M330 495H590V395"/>
  <text x="458" y="481" class="label" text-anchor="middle" fill="#a16207">Tickets · key</text>
  <path class="encrypted" d="M730 347H850"/>
  <text x="790" y="333" class="label" text-anchor="middle" fill="#2563eb">SSH</text>

  <path class="encrypted" d="M350 582H450" marker-start="url(#blue)"/>
  <text x="400" y="568" class="label" text-anchor="middle" fill="#2563eb">SFTP</text>
  <path class="local" d="M980 395V500H670V535"/>
  <text x="835" y="487" class="label" text-anchor="middle">Write notes</text>
  <path class="local" d="M730 582H850" stroke-dasharray="5 5"/>
  <text x="790" y="568" class="label" text-anchor="middle">Snapshots</text>

  <path class="encrypted" d="M590 630V704H980V745" marker-start="url(#blue)"/>
  <text x="785" y="691" class="label" text-anchor="middle" fill="#2563eb">make notes · SSH</text>
  <path class="encrypted" d="M850 798H730" marker-start="url(#blue)"/>
  <text x="790" y="780" class="label" text-anchor="middle" fill="#2563eb">pull / push</text>

  <path d="M50 877H82" stroke="#2563eb" stroke-width="3"/>
  <text x="92" y="883" class="small">Encrypted</text>
  <path d="M290 877H322" stroke="#a16207" stroke-width="3"/>
  <text x="332" y="883" class="small">Local HTTP (no TLS)</text>
  <path d="M620 877H652" stroke="#64748b" stroke-width="3"/>
  <text x="662" y="883" class="small">Local tools / files</text>
</svg>
