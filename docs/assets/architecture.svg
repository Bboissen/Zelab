<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1090" role="img" aria-labelledby="title description">
  <title id="title">Zelab: direct notes and optional project coordination</title>
  <desc id="description">Hermes bots use the bundled Obsidian skill to write notes directly, without Paperclip. The guest contains Hermes and the official Paperclip MCP ticket tools. Optional tracked work goes to host Paperclip, which starts bot runs through a separate API or sends work to host team accounts. One shared host vault contains Hermes personal notes and Paperclip project knowledge; both writers can edit either section. Root-only history keeps earlier versions. Deliberate private Git sync brings notes to optional desktop Obsidian. Blue links are encrypted, amber links use local HTTP, grey links are local tools or files. Folders do not isolate permissions.</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#2563eb"/></marker>
    <marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#a16207"/></marker>
    <marker id="grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 24px; font-weight: 700; }
      .role { font-size: 19px; fill: #475569; }
      .small { font-size: 16px; fill: #475569; }
      .tag { font-size: 16px; font-weight: 700; letter-spacing: 1.2px; }
      .encrypted { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#blue); }
      .http { fill: none; stroke: #a16207; stroke-width: 2.5; marker-end: url(#amber); }
      .local { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#grey); }
      .label { font-size: 16px; font-weight: 600; paint-order: stroke; stroke: #f8fafc; stroke-width: 7px; stroke-linejoin: round; }
      .node { fill: white; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1160" height="1090" rx="18" fill="#f8fafc"/>
  <rect class="node" x="70" y="30" width="260" height="95" rx="12"/>
  <text x="90" y="68" class="heading">Your chat</text>
  <text x="90" y="100" class="role">Ask, research &amp; remember</text>
  <rect class="node" x="650" y="30" width="220" height="95" rx="12"/>
  <text x="670" y="68" class="heading">Your browser</text>
  <text x="670" y="100" class="role">Review &amp; assign work</text>

  <rect x="30" y="180" width="1100" height="650" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="214" class="tag">YOUR SERVER</text>
  <rect x="50" y="235" width="490" height="330" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="266" class="tag">BOT GUEST</text>
  <rect class="node" x="70" y="290" width="260" height="95" rx="12"/>
  <text x="90" y="328" class="heading">Hermes bots</text>
  <text x="90" y="360" class="role">Personal work &amp; notes</text>
  <rect class="node" x="370" y="290" width="150" height="95" rx="12"/>
  <text x="385" y="328" class="heading">MCP</text>
  <text x="385" y="357" class="small">Paperclip tickets</text>
  <text x="225" y="485" class="role">Native Obsidian skill</text>
  <text x="225" y="517" class="small">No ticket needed for notes</text>
  <text x="225" y="549" class="small">Profiles share one account</text>

  <rect class="node" x="650" y="290" width="220" height="95" rx="12"/>
  <text x="670" y="328" class="heading">Paperclip</text>
  <text x="670" y="360" class="role">Track &amp; delegate work</text>
  <rect x="920" y="290" width="190" height="95" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="938" y="328" class="heading">Coding team</text>
  <text x="938" y="360" class="role">Build &amp; maintain</text>

  <rect class="node" x="50" y="635" width="810" height="165" rx="14"/>
  <text x="430" y="666" class="tag" text-anchor="middle">ONE SHARED VAULT · BOTH CAN WRITE</text>
  <rect x="70" y="690" width="320" height="85" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="90" y="723" class="heading">Hermes / bot</text>
  <text x="90" y="754" class="role">Ideas, research &amp; personal notes</text>
  <rect x="430" y="690" width="410" height="85" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="450" y="723" class="heading">Paperclip / Projects &amp; Server</text>
  <text x="450" y="754" class="role">Plans, decisions &amp; project knowledge</text>
  <rect class="node" x="920" y="690" width="190" height="85" rx="12"/>
  <text x="938" y="723" class="heading">Note history</text>
  <text x="938" y="752" class="small">Root only · every 5 min</text>

  <rect class="node" x="430" y="925" width="310" height="95" rx="12"/>
  <text x="450" y="960" class="heading">Desktop Obsidian</text>
  <text x="450" y="990" class="role">Your laptop · read &amp; edit</text>
  <rect class="node" x="850" y="925" width="260" height="95" rx="12"/>
  <text x="870" y="960" class="heading">Private notes repo</text>
  <text x="870" y="990" class="role">GitHub · carry notes</text>

  <path class="encrypted" d="M200 125V290" marker-start="url(#blue)"/>
  <text x="214" y="160" class="label" fill="#2563eb">TLS</text>
  <path class="encrypted" d="M760 125V235"/>
  <text x="775" y="164" class="label" fill="#2563eb">Tailnet HTTPS</text>
  <text x="775" y="198" class="small">+ sign-in</text>
  <path class="http" d="M760 235V290"/>
  <text x="775" y="269" class="label" fill="#a16207">Local HTTP</text>

  <path class="local" d="M330 337H370"/>
  <path class="http" d="M520 337H650"/>
  <text x="585" y="323" class="label" text-anchor="middle" fill="#a16207">Tickets · key</text>
  <path class="http" d="M760 385V450H310V385"/>
  <text x="610" y="437" class="label" text-anchor="middle" fill="#a16207">Bot runs · API key</text>
  <path class="encrypted" d="M870 337H920"/>
  <text x="895" y="322" class="label" text-anchor="middle" fill="#2563eb">SSH</text>

  <path class="encrypted" d="M150 385V610H230V690" marker-start="url(#blue)"/>
  <text x="165" y="595" class="label" fill="#2563eb">Direct notes · SFTP</text>
  <path class="local" d="M1015 385V590H635V690"/>
  <text x="810" y="577" class="label" text-anchor="middle">Direct notes · local files</text>
  <path class="local" d="M860 732H920" stroke-dasharray="5 5"/>
  <text x="890" y="681" class="small" text-anchor="middle">Snapshots</text>

  <path class="encrypted" d="M635 800V865H980V925" marker-start="url(#blue)"/>
  <text x="795" y="853" class="label" text-anchor="middle" fill="#2563eb">make notes · SSH</text>
  <path class="encrypted" d="M850 975H740" marker-start="url(#blue)"/>
  <text x="795" y="955" class="label" text-anchor="middle" fill="#2563eb">pull / push</text>

  <path d="M50 1060H82" stroke="#2563eb" stroke-width="3"/>
  <text x="92" y="1066" class="small">Encrypted</text>
  <path d="M290 1060H322" stroke="#a16207" stroke-width="3"/>
  <text x="332" y="1066" class="small">Local HTTP (no TLS)</text>
  <path d="M620 1060H652" stroke="#64748b" stroke-width="3"/>
  <text x="662" y="1066" class="small">Local tools / files</text>
</svg>
