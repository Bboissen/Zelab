<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-labelledby="title description">
  <title id="title">Zelab overview: a bot VM inside the Linux host</title>
  <desc id="description">The blue KVM virtual machine runs on the host but has its own operating system. It contains Hermes bots and Paperclip MCP ticket tools. Paperclip, the coding team, the shared notes vault and root-only note history run on the host, outside the VM. Bots write notes directly over SFTP. Optional tickets go to Paperclip, which can start bot runs in the VM or coding team work on the host. Private Git sync connects the host vault to desktop Obsidian on a laptop. Security controls and limits are shown in the separate security diagram.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 19px; fill: #475569; }
      .tag { font-size: 19px; font-weight: 700; letter-spacing: 1px; }
      .node { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { font-size: 18px; font-weight: 600; paint-order: stroke; stroke: #f8fafc; stroke-width: 7px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="980" rx="18" fill="#f8fafc"/>

  <rect class="node" x="80" y="32" width="300" height="92" rx="12"/>
  <text x="104" y="69" class="heading">Your chat</text>
  <text x="104" y="101" class="body">Discord, Telegram, …</text>
  <rect class="node" x="790" y="32" width="330" height="92" rx="12"/>
  <text x="814" y="69" class="heading">Your browser</text>
  <text x="814" y="101" class="body">Private dashboards</text>

  <rect x="24" y="195" width="1152" height="608" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
  <text x="48" y="232" class="tag">HOST · LINUX SERVER</text>

  <rect x="48" y="264" width="520" height="290" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <text x="72" y="303" class="tag" style="fill: #1d4ed8">VM · KVM GUEST</text>
  <rect class="node" x="76" y="336" width="240" height="96" rx="12"/>
  <text x="96" y="374" class="heading">Hermes bots</text>
  <text x="96" y="406" class="body">Chat, research &amp; notes</text>
  <rect class="node" x="356" y="336" width="180" height="96" rx="12"/>
  <text x="376" y="374" class="heading">MCP tools</text>
  <text x="376" y="406" class="body">Paperclip tickets</text>
  <text x="224" y="524" class="body">Separate OS · shared account</text>

  <rect class="node" x="748" y="336" width="280" height="96" rx="12"/>
  <text x="772" y="374" class="heading">Paperclip</text>
  <text x="772" y="406" class="body">Track &amp; delegate work</text>
  <rect class="node" x="748" y="508" width="280" height="96" rx="12"/>
  <text x="772" y="546" class="heading">Coding team</text>
  <text x="772" y="578" class="body">Claude Code / Codex</text>

  <rect class="node" x="76" y="674" width="710" height="100" rx="12"/>
  <text x="100" y="712" class="heading">Shared notes vault</text>
  <text x="100" y="745" class="body">Personal &amp; project notes · bots and team can both write</text>
  <rect class="node" x="882" y="674" width="262" height="100" rx="12"/>
  <text x="906" y="712" class="heading">Note history</text>
  <text x="906" y="745" class="body">Root only · every 5 min</text>

  <path class="flow" d="M196 124V158H12V384H76" marker-start="url(#arrow)"/>
  <path class="flow" d="M955 124V336"/>
  <text x="971" y="168" class="label">Tailnet access</text>
  <path class="flow" d="M316 384H356"/>
  <path class="flow" d="M536 384H748"/>
  <text x="654" y="365" class="label" text-anchor="middle">Optional tickets</text>
  <path class="flow" d="M748 416H680V480H280V432"/>
  <text x="620" y="466" class="label" text-anchor="middle">Bot runs</text>
  <path class="flow" d="M888 432V508"/>
  <path class="flow" d="M164 432V674" marker-start="url(#arrow)"/>
  <text x="180" y="622" class="label">Direct notes · SFTP</text>
  <path class="flow" d="M888 604V638H656V674" marker-start="url(#arrow)"/>
  <text x="773" y="626" class="label" text-anchor="middle">Local files</text>
  <path class="flow" d="M786 724H882" stroke-dasharray="6 5"/>

  <rect class="node" x="100" y="870" width="340" height="84" rx="12"/>
  <text x="124" y="906" class="heading">Desktop Obsidian</text>
  <text x="124" y="934" class="body">Your laptop</text>
  <rect class="node" x="700" y="870" width="360" height="84" rx="12"/>
  <text x="724" y="906" class="heading">Private Git notes repo</text>
  <text x="724" y="934" class="body">Sync on demand</text>
  <path class="flow" d="M650 774V835H880V870" marker-start="url(#arrow)"/>
  <text x="765" y="822" class="label" text-anchor="middle">make notes</text>
  <path class="flow" d="M700 912H440" marker-start="url(#arrow)"/>
  <text x="570" y="896" class="label" text-anchor="middle">pull / push</text>
</svg>
