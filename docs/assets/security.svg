<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1330" role="img" aria-labelledby="title description">
  <title id="title">Discord to host: security controls and their limits</title>
  <desc id="description">Discord messages reach Hermes over provider TLS, authenticated by the bot token and filtered by Hermes' native chat allowlist. All bot profiles share a guest account in a separate KVM operating system, including accessible files and credentials. Chat has native files but no terminal; Paperclip bot runs have a terminal. Guest nftables limits normal traffic to public internet, QEMU DNS and DHCP, and two host application destinations: scoped Paperclip ticket access and chrooted SFTP for the whole vault. Guest root can change that firewall. Paperclip dispatches bot runs back to the VM over keyed local HTTP, or host team work over restricted tier SSH keys. A bot can assign the PM, which can delegate to any team member, including Docker and full-sudo tiers. This path needs no owner approval. Root-only history is outside the share but host root can alter it. Prompts are not access controls. This diagram describes configured controls, not end-to-end acceptance.</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#2563eb"/></marker>
    <marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#a16207"/></marker>
    <marker id="grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 19px; fill: #475569; }
      .tag { font-size: 19px; font-weight: 700; letter-spacing: 1px; }
      .node { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .encrypted { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#blue); }
      .http { fill: none; stroke: #a16207; stroke-width: 2.5; marker-end: url(#amber); }
      .local { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#grey); }
      .label { font-size: 18px; font-weight: 600; paint-order: stroke; stroke: #f8fafc; stroke-width: 7px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="1330" rx="18" fill="#f8fafc"/>
  <rect class="node" x="76" y="28" width="464" height="96" rx="12"/>
  <text x="100" y="66" class="heading">Discord users &amp; messages</text>
  <text x="100" y="98" class="body">Untrusted input · prompt injection possible</text>
  <path class="encrypted" d="M308 124V166"/>
  <rect class="node" x="76" y="166" width="464" height="120" rx="12"/>
  <text x="100" y="204" class="heading">1 · Native chat access</text>
  <text x="100" y="237" class="body">Provider TLS + bot token</text>
  <text x="100" y="265" class="body">Hermes allowlist + Discord permissions</text>

  <text x="650" y="69" class="heading">Discord → VM → host</text>
  <text x="650" y="104" class="body">Blue: encrypted transport</text>
  <text x="650" y="134" class="body">Amber: local HTTP, without TLS</text>
  <text x="650" y="164" class="body">Grey: local tools (stdio)</text>
  <text x="650" y="192" class="body">Admin access is separate:</text>
  <text x="650" y="222" class="body">tailnet HTTPS + native app sign-in.</text>
  <text x="650" y="252" class="body">TLS ends at Tailscale Serve;</text>
  <text x="650" y="282" class="body">backend dashboard hops use HTTP.</text>

  <rect x="24" y="328" width="1152" height="890" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
  <text x="48" y="365" class="tag">HOST · LINUX SERVER</text>
  <rect x="48" y="390" width="520" height="520" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <text x="76" y="429" class="tag" style="fill: #1d4ed8">2 · VM / SEPARATE KVM GUEST OS</text>
  <path class="encrypted" d="M308 286V306H12V539H76"/>
  <rect class="node" x="76" y="460" width="464" height="158" rx="12"/>
  <text x="100" y="498" class="heading">Hermes · one shared account</text>
  <text x="100" y="531" class="body">All profiles share accessible files &amp; logins.</text>
  <text x="100" y="561" class="body">Chat: native file tools, no terminal.</text>
  <text x="100" y="591" class="body">Ticketed bot runs: terminal in this VM.</text>

  <rect class="node" x="76" y="652" width="464" height="86" rx="12"/>
  <text x="100" y="686" class="heading">Paperclip MCP · ticket tools</text>
  <text x="100" y="716" class="body">Scoped task key for each keyed profile</text>
  <path class="local" d="M308 618V652"/>
  <text x="324" y="641" class="body">stdio</text>
  <rect x="76" y="774" width="464" height="112" rx="12" fill="#dbeafe"/>
  <text x="100" y="808" class="tag">GUEST FIREWALL · NFTABLES</text>
  <text x="100" y="838" class="body">Blocks other host ports, LAN, tailnet, IPv6.</text>
  <text x="100" y="868" class="body">Guest root can change these rules.</text>

  <rect class="node" x="760" y="460" width="390" height="200" rx="12"/>
  <text x="784" y="498" class="heading">3 · Paperclip authorization</text>
  <text x="784" y="531" class="body">Task key: picked projects &amp; tickets.</text>
  <text x="784" y="561" class="body">Assignees: bots, PM or unassigned.</text>
  <text x="784" y="591" class="body">PM is the only direct team assignee.</text>
  <text x="784" y="631" class="body">Bot runs return to the VM via API.</text>
  <path class="http" d="M540 695H650V520H760"/>
  <text x="650" y="501" class="label" text-anchor="middle">Tickets · HTTP</text>
  <path d="M760 631H596V585H540" fill="none" stroke="#f1f5f9" stroke-width="8"/>
  <path class="http" d="M760 631H596V585H540"/>
  <text x="650" y="616" class="label" text-anchor="middle">API key · HTTP</text>

  <rect class="node" x="760" y="740" width="390" height="170" rx="12"/>
  <text x="784" y="778" class="heading">Shared host vault</text>
  <text x="784" y="811" class="body">Key + pinned host key + SFTP chroot</text>
  <text x="784" y="841" class="body">No shell or forwarding on this listener.</text>
  <text x="784" y="881" class="body">Bots can read, edit &amp; delete all notes.</text>
  <path d="M540 550H716V800H760" fill="none" stroke="#f1f5f9" stroke-width="8"/>
  <path class="encrypted" d="M540 550H716V800H760" marker-start="url(#blue)"/>
  <text x="650" y="773" class="label" text-anchor="middle">Notes · SFTP</text>

  <rect x="48" y="980" width="390" height="210" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="72" y="1018" class="heading">Tickets can reach host root</text>
  <text x="72" y="1051" class="body">Bot → ticket → PM → any team tier.</text>
  <text x="72" y="1081" class="body">No per-command owner approval.</text>
  <text x="72" y="1111" class="body">PM routing is a model decision.</text>
  <text x="72" y="1160" class="body" style="fill: #9a3412; font-weight: 700">Prompts are not access controls.</text>

  <rect class="node" x="488" y="980" width="662" height="210" rx="12"/>
  <text x="512" y="1018" class="heading">4 · Host team accounts</text>
  <text x="512" y="1051" class="body">SSH tier keys: source-restricted, no forwarding.</text>
  <text x="512" y="1081" class="body">dev: own paths, no sudo · ops: Docker, root-equivalent</text>
  <text x="512" y="1111" class="body">root: full sudo · each account's OS rights are the limit.</text>
  <text x="512" y="1160" class="body">All tiers write the whole vault; host root can alter history.</text>
  <path class="encrypted" d="M1150 560H1163V948H820V980"/>
  <text x="907" y="937" class="label" text-anchor="middle">Team work · SSH</text>

  <text x="48" y="1256" class="body">Normal guest egress also permits public internet and QEMU DNS/DHCP.</text>
  <text x="48" y="1286" class="body">Configured controls shown here; live acceptance and remaining gaps are recorded in STATUS.md.</text>
</svg>
