# Overrides for a second, guest-only test VM beside a full site. Merge these
# into a separate site file and run `make SITE_CONFIG=...`.
# This is the VM component only; it does not assert full isolated-site acceptance.
vm_instance: zelab-fresh
vm_service: zelab-fresh-vm
vm_user: zelab-fresh-vm
vm_disk_gib: 16
vm_root: /var/lib/zelab-fresh-vm/root
vm_data: /var/lib/zelab-fresh-vm/data
vm_bootstrap_dir: /var/lib/zelab-fresh-vm/bootstrap
guest_ssh_port: 12931
guest_dashboard_port: 18650
guest_api_port: 18652
# Private paths derive a separate subdirectory from vm_instance. Explicit path
# overrides must also be separate; never reuse the main VM's key or pin file.
# Optional initial native auth import; never overwrite an existing auth.json.
# hermes_auth_import:  # absolute path to the explicitly chosen auth file
