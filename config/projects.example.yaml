# Projects make creates, and this site's tier paths. Copy to config/projects.yaml
# (kept out of Git), edit, then run `rtk proxy make`.
#
# projects: the key is the project's slug, its vault folder Projects/<slug>/.
#   name: the Paperclip project name (default: the slug).
# A project is only where tickets and notes go; it grants no host rights.
# Removing a project here keeps its Paperclip project, tickets and vault folder.
#
# tiers: optional overrides of config/team.yaml's tiers for this host.
#   preset: none of the tiers' rights change unless you set this
#           (monitor-readonly | docker | repo-dev | full-sudo)
#   paths:  directories the tier's account may use (read-only for monitor-readonly),
#           for example your Docker projects for the ops tier.
projects:
  homelab:
    name: Homelab
  research: {}
tiers:
  ops:
    paths: [/srv/compose]
